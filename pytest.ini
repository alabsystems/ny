#
# Explicit Python binding-conformance configuration for ny.
#
# Cargo, not pytest, is the canonical default correctness suite. Benchmark
# comparators are fail-fast tools under benchmarks/ and are not collected as
# tests.
#
# Usage:
#   pytest                          # Python binding surface only
#   pytest crates/ny-python/tests   # Run Python binding tests only
#   pytest tests/                   # Transitional repository-tool assertions
#
# See benchmarks/README.md for VNN-COMP benchmark documentation.

[pytest]
testpaths =
    crates/ny-python/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    # Benchmark categories
    acasxu: ACAS-Xu collision avoidance benchmark
    mnist: MNIST digit classification benchmark
    cifar: CIFAR image classification benchmark
    vit: Vision Transformer benchmark
    vggnet: VGGNet benchmark
    nn4sys: NN4Sys systems benchmark
    cgan: CGAN benchmark
    yolo: YOLO object detection benchmark
    traffic_signs: traffic-sign recognition benchmark
    # Year markers
    vnn2021: VNN-COMP 2021 benchmarks
    vnn2023: VNN-COMP 2023 benchmarks
    vnn2024: VNN-COMP 2024 benchmarks
    vnn2025: VNN-COMP 2025 benchmarks
    # Speed markers
    slow: marks tests as slow (>60s)
    fast: marks tests as fast (<10s)

# Default options
addopts = -v --tb=short
pythonpath = .
