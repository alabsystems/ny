[package]
name = "ny-cert"
description = "Proof-carrying verification: exact-rational CROWN certificates checkable by Clean's external-certificate verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = []
# Independent external proof-checker conformance lanes. Each lane is absent
# from the hermetic default suite and fails fast on a missing/mismatched tool
# when explicitly selected.
external-ay = []
external-carcara = []
external-lean = []

[dependencies]
# NO PROC-MACRO DEPENDENCIES. Evidence-grade verification enforces a
# no-proc-macro TCB boundary (an in-process proc macro shares rustc's argv,
# memory, stderr, and artifact filesystem, and can forge the TRUSTJSON proof
# transport), so a proc macro anywhere in this graph makes the whole bignum
# stack unverifiable-and-assumed rather than verified. Three dependencies were
# therefore removed and hand-expanded in-crate:
#   * `thiserror` (pulls `thiserror-impl`)  -> hand-written Display/Error/From.
#   * serde's `derive` feature (pulls `serde_derive`) -> hand-written
#     `lake-manifest.json` decoding in `cite_check`'s test module.
#   * `serde_json` (and with it `serde`/`serde_core`) -> the in-crate `json`
#     module.
#
# NO SIMD SUBSTRING SEARCHER IN THE TRUSTED BASE. `serde_json` pulls `memchr`,
# whose hand-vectorized `unsafe` pointer arithmetic accounted for ~78% of every
# proof obligation and ~97% of every failure in the dependency-verification run
# (1195 of 1231 FAILED), and `itoa`/`zmij` for number formatting. That whole
# edge existed to parse three repo-hygiene manifests; `crates/ny-cert/src/json.rs`
# replaces it with a byte-compatible reader/writer written to this crate's
# provability discipline (no indexing, no unwrap, no unsafe, explicit depth
# budget). Certificates are EMITTED by ny-cert and never parsed by it.
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
# Contract attributes (`#[trust::requires/ensures]`). The NY-owned compatibility
# macros are no-ops under stable rustc; the external Trust verifier consumes the
# attributes as proof obligations. The dependency key remains `trust` so the
# attribute path resolves via the extern prelude under both rustc and trustc.
trust.workspace = true

[dev-dependencies]
ntest.workspace = true
tempfile.workspace = true
