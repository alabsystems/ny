[package]
name = "ny-onnx"
description = "Multi-format model loading, conversion, and analysis for ny IR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[[example]]
name = "cut_fold_cifar100_resident"
required-features = ["wgpu"]

[[example]]
name = "vit-zero-width-node-bisect"
path = "examples/vit_zero_width_node_bisect.rs"
required-features = ["external-vnncomp"]
test = false

[[test]]
name = "cctsdb_cast_admission_loads"
required-features = ["external-vnncomp"]

[[test]]
name = "cctsdb_readout_continuity"
required-features = ["external-vnncomp"]

[[test]]
name = "cgan_int64_shape_arithmetic_admission"
required-features = ["external-vnncomp"]

[[test]]
name = "ml4acopf_literal_cone_loads"
required-features = ["external-vnncomp"]

[[test]]
name = "ml4acopf_attack_point_gradient"
required-features = ["external-vnncomp"]

[[test]]
name = "lsnc_interval_carrier"
required-features = ["external-vnncomp"]

[[test]]
name = "lsnc_attack_twin"
required-features = ["external-vnncomp"]

# #lsnc-lane stage 3: the lane's domains/s on the real lsnc net (row 2 clause
# 0) — a wall-clock measurement on the competition corpus, so it needs BOTH
# lanes: absent from the default suite, hard failure without the corpus.
[[test]]
name = "lsnc_lane_bench"
required-features = ["external-vnncomp", "benchmarks"]

# #iso-edge-cap step 5: the #lowdim lane's domains/s and closure on the
# stitched isomorphic_acasxu_2026 difference net (the phase-2 gate) plus its
# soundness controls — corpus-backed and wall-clock, so both lanes again.
[[test]]
name = "iso_lane_bench"
required-features = ["external-vnncomp", "benchmarks"]

[lints]
workspace = true

[features]
default = ["onnx-value-info", "ort", "wgpu"]
onnx-value-info = []
benchmarks = []
ort = ["dep:ort", "dep:ort-tract"]
wgpu = ["ny-gpu/wgpu"]
# Real exported models, competition corpora, and accelerator hardware are
# conformance inputs rather than unit-test fixtures.  Their tests are
# registered only when the corresponding lane is selected explicitly through
# `ny_onnx_conformance`; unlike libtest `ignore`, an enabled lane fails hard
# when an input is absent.
external-avoice = []
external-whisper = []
external-vnncomp = []
external-decoders = []
external-wgpu = ["wgpu"]
external-conformance = [
    "external-avoice",
    "external-whisper",
    "external-vnncomp",
    "external-wgpu",
]
internal-test-utils = []
pytorch = ["dep:candle-core", "dep:zip"]
coreml = ["dep:coreml-proto"]
gguf = ["dep:gguf"]

[dependencies]
ny-core = { path = "../ny-core" }
ny-levers = { path = "../ny-levers" }
ny-tensor = { path = "../ny-tensor" }
ny-propagate = { path = "../ny-propagate" }
ny-gpu = { path = "../ny-gpu", default-features = false }
ny-build = { path = "../ny-build" }
ny-load = { path = "../ny-load" }
half.workspace = true
ndarray.workspace = true
prost.workspace = true
safetensors.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
npyz.workspace = true
candle-core = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
coreml-proto = { workspace = true, optional = true }
# GGUF format support (for llama.cpp models)
gguf = { workspace = true, optional = true }
flate2 = "1.0"
# Real file identity — (volume serial, file index) on Windows via
# GetFileInformationByHandle, (dev, ino) on Unix. std exposes the Windows half
# only behind the unstable `windows_by_handle` feature, and the stable
# substitute (creation_time) cannot see an NTFS-tunnelled replacement. Already
# in the dependency graph behind walkdir.
same-file = "1.0"
tempfile.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { workspace = true, features = ["blas"] }
blas-src.workspace = true

[dev-dependencies]
approx.workspace = true
bytemuck.workspace = true
ny-test-utils = { path = "../ny-test-utils" }
libm.workspace = true
ntest.workspace = true
tracing-subscriber.workspace = true

# ONNX EXECUTION ENGINE, chosen by target.
#
# `ort` is the API; the engine behind it is a build-time choice. Upstream ships
# no prebuilt ONNX Runtime for Intel macOS (verified against rc.12 AND rc.13 —
# both fail the same way), so that one target links tract, a pure-Rust ONNX
# engine, through ort's `alternative-backend` seam. The call sites do not
# change: `crate::runtime::session_builder()` installs whichever engine this
# build carries.
#
# The two blocks are mutually exclusive, so their `ort` feature sets never
# unify — `download-binaries` is never requested for the target that has none,
# and the API LEVEL stays per-engine. That last part is load-bearing: ort-tract
# implements the ort C API at api-17, and a shared `api-24` reaches editor-API
# entry points it leaves unimplemented, so `ort` panics on its own
# `expect("infallible")` the moment a session is committed. Raising the level
# here means raising it only for an engine that implements it.

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { workspace = true, optional = true, features = [
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
    "api-24",
] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { workspace = true, optional = true, features = ["alternative-backend", "api-17"] }
ort-tract = { workspace = true, optional = true }
