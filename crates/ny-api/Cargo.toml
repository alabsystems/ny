[package]
name = "ny-api"
description = "Stable public API facade for ny integration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
# Default to propagation and certificate contracts without the optional MIP or
# GPU dependencies. `propagate` alone would omit the certificate test targets.
# Keep required-features: these tests import feature-gated modules, and the
# build tool skips targets whose requirements are unmet. Complete verification
# and GPU contracts require explicit `complete` and `gpu` selection below.
# The CLI already requests `cert`, so this default adds no dependency to it.
default = ["cert"]
propagate = ["dep:ny-build", "dep:ny-propagate", "dep:ndarray", "dep:ny-levers"]
# Proof-carrying certificates (exact-rational Farkas/entailment, Clean-checkable).
cert = ["propagate", "dep:ny-cert", "dep:serde_json"]
# Complete verification via MIP (ay).
complete = ["propagate", "dep:ny-mip"]
# Everything: propagation facade + certificates + complete MIP.
full = ["propagate", "cert", "complete"]
# Optional typed GPU requests still require live device qualification. Enable
# ny-gpu/wgpu explicitly because its typed constructors are feature-gated.
gpu = ["propagate", "dep:ny-gpu", "ny-gpu/wgpu"]
# Explicit real-adapter qualification probes. These are excluded from ordinary
# unit runs because they create a WGPU context and compile verdict-critical
# pipelines, but they execute normally (never as ignored tests) when selected.
gpu-tests = ["gpu"]

[dependencies]
ny-build = { path = "../ny-build", optional = true }
ny-core = { path = "../ny-core" }
# The lever registry + search space, for the curated `levers` facade. Follows
# `propagate` because that is exactly where the `NY_*` readers live: ny-core,
# ny-tensor and ny-build contain none. Leaf crate; its only third-party
# dependency is serde_json, which ny-propagate already pulls in through it.
ny-levers = { path = "../ny-levers", optional = true }
ny-tensor = { path = "../ny-tensor" }
ny-propagate = { path = "../ny-propagate", optional = true }
ny-cert = { path = "../ny-cert", optional = true }
ny-mip = { path = "../ny-mip", optional = true }
# GPU device + typed verdict-request surface (only with the `gpu` feature).
ny-gpu = { path = "../ny-gpu", optional = true }
# Serialize Clean-canonical certificate JSON (only with the `cert` feature).
serde_json = { workspace = true, optional = true }
# Needed by the sound layer-aware precision path (PART D) for per-element bound
# array manipulation; only pulled in with the `propagate` facade.
ndarray = { workspace = true, optional = true }

[dev-dependencies]
ny-test-utils = { path = "../ny-test-utils" }
ndarray.workspace = true
half.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
ndarray = { workspace = true, features = ["blas"] }
blas-src.workspace = true

[[test]]
name = "propagate_facade_contract"
required-features = ["propagate"]

[[test]]
name = "graph_model_handoff"
required-features = ["propagate"]

[[test]]
name = "singing_pitch_control_handoff"
required-features = ["propagate"]

[[test]]
name = "phoneme_feature_certificate_handoff"
required-features = ["propagate"]

[[test]]
name = "sound_precision_acceptance"
required-features = ["propagate"]

[[test]]
name = "lipschitz_sound"
required-features = ["cert"]

[[test]]
name = "symmetry_invariance"
required-features = ["propagate"]

[[test]]
name = "facade_expansion_contract"
required-features = ["cert"]

[[test]]
name = "graph_layer_facade_contract"
required-features = ["propagate"]

# Installs process-global lever cells, so it must own its own process: the
# library test binary asserts the UNINSTALLED defaults at the same time.
[[test]]
name = "levers_install_once"
required-features = ["propagate"]

[[test]]
name = "gpu_facade_contract"
required-features = ["gpu"]

[[test]]
name = "complete_facade_contract"
# `cert` too: the test pins that the Farkas evidence PRODUCER (`complete`) and
# its CHECKER (`cert`) are both reachable from the facade.
required-features = ["complete", "cert"]
