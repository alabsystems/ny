[package]
name = "ny-propagate"
description = "Bound propagation algorithms (IBP, CROWN, α-CROWN, β-CROWN)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
benchmarks = []
# Explicit pinned original-model conformance. Missing request/assets fail;
# normal numerical tests and production routing do not require model downloads.
external-models = []
# Real-adapter integration for propagation's GPU-CROWN consumer seams. Default
# tests use hermetic recording engines; this explicit lane fails fast when the
# explicitly requested device cannot pass the five-rung sound-authority ladder.
gpu-tests = []
# The subset of that lane whose subject is UNCHARGED verdict authority or the
# margin-row EFT channel: it needs an adapter that passes the uncharged
# five-rung ladder and keeps subnormals and EFT residuals (DenormPreserve) —
# measured only on Vulkan with the SPIR-V DenormPreserve injection (GB10). A
# pure-flush adapter (Apple/Metal, measured) refuses by hardware, so selecting
# this lane there fails each test naming the refusal; the plain `gpu-tests`
# lane stays meaningful on such a host. See TEST_CONFORMANCE.md.
gpu-tests-uncharged = ["gpu-tests"]
# CUDA small-row sound-fold and packed-root conformance. Requires a real device;
# fails if unavailable and is absent from the portable GPU/CPU test lanes.
gpu-tests-cuda = []
# Diagnostic harnesses that PRINT observed behaviour for re-seeding a pinned
# guard, rather than asserting anything. They are tools, not coverage, so they
# are absent from the default lane instead of `#[ignore]`d in it — TEST_CONFORMANCE.md:
# "External tests are absent from the default lane rather than reported as ignored."
# Distinct from `benchmarks`, which gates wall-clock timing.
diagnostics = []

[lints]
workspace = true

[dependencies]
ny-core = { path = "../ny-core" }
ny-levers = { path = "../ny-levers" }
trust.workspace = true
ny-tensor = { path = "../ny-tensor" }
anyhow.workspace = true
ndarray.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
tracing.workspace = true
serde.workspace = true
# Certificate replay compares original binary64 summaries exactly after JSON.
serde_json = { workspace = true, features = ["float_roundtrip"] }
hashbrown.workspace = true
libm.workspace = true
faer.workspace = true
rand.workspace = true
bytemuck.workspace = true
sha2.workspace = true
num-rational.workspace = true
num-bigint.workspace = true
num-traits.workspace = true

[dev-dependencies]
approx.workspace = true
proptest.workspace = true
ntest.workspace = true
criterion.workspace = true
ny-gpu = { path = "../ny-gpu" }
ny-cuda = { path = "../ny-cuda" }
ny-tensor = { path = "../ny-tensor", features = ["test-utils"] }
ny-test-utils = { path = "../ny-test-utils" }
# Exact-rational CROWN gold oracle for the strict A·W soundness proptest
# (#vnncomp-aw-soundness). ny-cert has no dependency on ny-propagate, so this
# dev-dependency introduces no cycle.
ny-cert = { path = "../ny-cert" }
half.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { workspace = true, features = ["blas"] }
blas-src.workspace = true

[[bench]]
name = "propagation"
harness = false
