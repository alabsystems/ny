[package]
name = "ny-groundtruth"
description = "Geometric ground-truth graphs (squared/residual polynomial form) for verifying networks against analytic geometry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = []
# Exact nonlinear-SMT conformance through the revision-pinned external `ay`
# executable. Tests in this lane fail fast if that executable is unavailable.
external-ay = []

[dependencies]
ny-cert = { path = "../ny-cert" }
ny-core = { path = "../ny-core" }
ny-propagate = { path = "../ny-propagate" }
ny-tensor = { path = "../ny-tensor" }
ndarray.workspace = true
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
