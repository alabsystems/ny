#
# Choose the verification lane per targo command; keep Trust policy in
# Cargo.toml rather than per-unit compiler overrides here.

[net]
git-fetch-with-cli = true

# Unit tests exercise many production environment policies through scoped
# process-global overrides. Serializing only the writers is insufficient:
# unrelated parallel readers can observe those temporary values and take a
# different proof route. The ny-propagate test binary is also tensor-heavy, so
# bounding concurrency controls its peak RSS. Keep the workspace's default
# libtest execution deterministic and within the memory cap. A deliberately
# isolated test may still override this with an explicit `--test-threads`
# argument.
[env]
RUST_TEST_THREADS = "1"

# Develop AY in its own checkout, publish it, then pin its Git revision in
# ny-mip/Cargo.toml. Keep the real Git provenance for sealed builds.
# Do not source-replace internal repositories with vendored copies.

# gemm-f16 emits fullfp16 instructions on aarch64. Deployment hosts (Grace
# and Apple Silicon) support them; generic Linux-aarch64 does not enable the
# feature by default. Keep this target baseline independent of the build host.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16"]
