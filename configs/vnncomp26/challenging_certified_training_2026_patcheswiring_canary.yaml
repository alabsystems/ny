#
# CANARY — NOT category-resolvable, NEVER shipped as the effective preset.
#
# #patches-engine-refusal-containment + #fast-f32-prewarm-all-hosts
# (reports/measured-2026/cct_bound_gap_2026-08-31): the production
# challenging_certified_training_2026 preset with EXACTLY the two dark
# engine-wiring keys armed, for canary runs via an explicit --configs-dir.
# The suffixed filename is pinned unreachable by category resolution
# (`patches_engine_wiring_stays_dark_in_every_resolvable_preset`), so this
# file can never arm a scored run.

general:
  root_path: ../../benchmarks/vnncomp2026/benchmarks/challenging_certified_training_2026/2.0
  csv_name: instances.csv
  device: wgpu

attack:
  pgd_order: middle
  ny_pgd_order_compat: upfront
  pgd_restarts: 20
  pgd_restart_when_stuck: true

bab:
  batch_size: 256
  # #dense-sparse-seed: alpha-beta-CROWN's sparse-intermediate rule for the
  # sequential CROWN-IBP collector's Dense (FC) targets. A ReLU-successor Gemm
  # target that is at least 10% IBP-stable walks only its IBP-unstable rows
  # (cnn7's FC 32768->512+BN: ~68 of 512) instead of all of them; untracked
  # stable neurons publish the certified IBP box. Default 0.9 elsewhere.
  crown_partial_dense_min_stable: 0.1
  # THE CANARY PAIR — the only two keys that differ from the production yaml
  # (pinned by `patcheswiring_canary_differs_by_exactly_the_two_typed_keys`).
  patches_engine_refusal_containment: true
  fast_f32_prewarm: true
  branching:
    # No explicit method: auto-branching picks kFSB ReLU-split for this conv net.
    candidates: 8
  alpha_crown:
    lr_alpha: 0.25
    iterations: 30
    full_conv_alpha: false
  beta_crown:
    lr_beta: 0.2
    iterations: 12
  clip:
    relaxed: true
  phase_budget:
    # Hard margins: give BaB the bulk of the clock; cap warmup + PGD.
    initial_bounds_fraction: 0.15
    disjunctive_pgd_fraction: 0.10
    post_bab_pgd_fraction: 0.10

# MARGIN-ROW LANE (#cct-margin-row-admission, 2026-09-24) — UNMEASURED ARMING.
#
# WHY. ny's strongest robustness lane (the certified twin-wall tableau +
# margin-row BaB that proves cifar100/tinyimagenet: stock 0/20 vs lane 20/20 on
# resnet_large) never ran on this category: every flight record read
# `margin_row_reserve skipped ... route=NotApplicable`, for two structural
# reasons now fixed in code —
#   (a) the hand vnnlib parser only knew `(and (>= Y_j Y_t))`; both cct corpora
#       spell the property `(and (<= Y_t Y_j))` / `(and (<= Y[0,t] Y[0,j]))`
#       (true class on the LEFT). Parsed now, behind the unchanged
#       trusted-parser cross-check (fails closed on any divergence);
#   (b) CNN7's head is `Gemm -> BatchNormalization -> Relu -> Gemm`. The BN is
#       now folded into the head Gemm with a CERTIFIED error (relative weight
#       error RHO_FOLD, absolute per-row bias error) that the lane charges in
#       every head bound — NOT alpha-beta-CROWN's `merge_bn` (nearest-rounded
#       fp32, no error term).
# Engagement observables, all unconditional: `[margin-row] fc-bn fold: ...`
# (extractor), `[margin-row] vnnlib robustness spec: form=le ...` (parser),
# `margin-row BaB: started CONCURRENT lane ...` + flight
# `margin_row_concurrent=Ran`, then `margin-row BaB (concurrent): UNSAT|no
# verdict`. Absent lines = VOID, not negative.
#
# ONLY THE CIFAR10 ROWS CAN ENTER. The TinyImageNet CNN7 pair extracts cleanly
# but its root tableau (widest tensor x (n_in+1) = 3.2e9 / 6.4e9 f64 entries,
# 26 / 52 GB per matrix) is above `MAX_ROOT_TABLEAU_ENTRIES` (2^30); the
# compiler and the admission probe both refuse it, so those rows keep today's
# route untouched (no reserve, no lane, no allocation).
#
# THE RESERVE. `reserve_secs: 0` + `concurrent: true` is tinyimagenet_2024's
# pattern, NOT cifar100's `adaptive_reserve`: this category has three budget
# tiers (30/120/550 s), and the adaptive release (45 s >= 0.40 x internal)
# fires only at 30 s (internal 114 s -> 45.6 s, 523 s -> 209 s), so cifar100's
# block would hold 45 s of the verifier on the 120 s AND 550 s tiers while the
# concurrent lane also contends there — the double tax
# `concurrent_presets_never_also_hold_a_reserve` forbids. It would also arm the
# scored sparse root CROWN pass inside the VERIFIER on the released tiers, an
# unmeasured verifier change on the 14 banked rows. With `reserve_secs: 0` the
# verifier's budget and route are byte-identical to before; the lane runs
# alongside it from instance start (GPU verifier, CPU lane).
#
# THE LANE LEVERS are cifar100_2024's shipped set (cifar-sized input, 10
# classes): closure ladder, reduceop max + interm-alpha pair, parent lift,
# clip rows/interm, column retire, root_f32, backward-interm (40 s), root
# alpha ascent with alpha_cols 1, k_head/k_trunk 16. None is measured HERE.
#
# DECIDING MEASUREMENT (not yet run — no box time at write). Rows: the cifar
# GAP rows (field-proved unsat, ny banked timeout) — 120 s tier eps2_cnn7
# idx448/3619, eps2_wide idx381/5660, eps8_cnn7 idx1031/9352, eps8_wide
# idx9125/1682; 30 s tier eps2_cnn7 idx9890, eps2_wide idx758, eps8_wide
# idx3144; then the 550 s tier's eps2_cnn7 idx1440/5510/0, eps2_wide
# idx5118/402/9352. Official budgets, zero NY_*, drive `ny vnncomp` directly
# with stderr captured per row, 1 rep (3 on any conversion).
# THE CONTROL ARM IS THE PRE-BRANCH BINARY with this same yaml (it cannot
# extract CNN7's FC-BN head, so the lane declines exactly as it did before).
# It can NOT be this binary with the block edited (review 2026-09-24):
#   * deleting this block gives cct rows the DEFAULT fixed 45 s reserve — the
#     30 s tier's verifier would keep ~10 s and lose idx5323;
#   * `margin_row: {reserve_secs: 0}` is not today's route either: every banked
#     cct timeout quits at 63-80% of its budget, and with no concurrent lane
#     the INLINE post-verifier lane (`try_margin_row_unsat`), which now admits
#     these nets, runs on that tail — the arm would measure inline-vs-concurrent.
# MOAT before arming ships: all 14 banked cct verdicts (11 sat, 3 unsat;
# idx5323 @19.6 s needs 3 reps — it is the row most exposed to the lane's CPU
# contention). The TinyImageNet CNN7 rows DO print `[margin-row] fc-bn fold`
# (extraction runs before the cap check) and the `CONCURRENT lane not started
# ... root-tableau cap` line; they must print NO `started CONCURRENT lane`.
# NEGATIVE CONTROLS, mandatory: the two 550 s cifar rows whose field truth is
# SAT and whose ny bank is timeout — eps8_cnn7 idx8090_sample7 and eps8_wide
# idx8397_sample9. The verifier times out there, so the lane's verdict IS
# consumed: a `margin-row BaB (concurrent): UNSAT` line on either is a
# soundness emergency. Plus the cifar100_2024 / tinyimagenet_2024 re-moat
# (shared parser, extractor and engine) and relusplitter_2025's oval21 rows
# (the parser widening admits them at the DEFAULT 45 s fixed reserve).
margin_row:
  reserve_secs: 0
  concurrent: true
  root_f32: true
  column_retire: true
  closure_adaptive: true
  closure_max_tier: 2
  branch_reduce_max: true
  parent_lift: true
  clip_interm: true
  clip_rows: true
  interm_alpha: 2
  k_head: 16
  k_trunk: 16
  bi_secs: 40
  backward_interm: true
  alpha_opt: true
  alpha_cols: 1
