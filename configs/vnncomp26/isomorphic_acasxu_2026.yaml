#
# isomorphic_acasxu_2026 — VNN-COMP 2026 relational (dual-network) category.
#
# This category enables the measured original-tower search worker beside the
# scored-wall deadline policy. Across the complete50original-budget sweep it
# accepted26cases versus23for scheduling alone; all3new UNSAT conversions
# repeated3/3against both the prior image and the same-image advice-off control.
# See reports/measured-2026/paired-relational-composed-repeated-conversions-20261107.
#
# Relational categories deliberately bypass the YAML preset path for model and
# solver SHAPE: they do not verify the preset's network, they build a DIFFERENCE
# network from two of them, so a preset's batch sizes, bound-prop method and
# branching tuning describe a graph that is never constructed. That bypass is
# correct and is left alone.
#
# The attack flags select scoped scheduling and cached CPU point/VJP advice.
# Proposals still pass the original dual-model/full-property witness gate;
# proof results still come from the original shared-input difference graph.
# Search draws, node/depth limits and original case budgets are unchanged.
#
# The deadline policy addresses the family's measured defect, caused
# precisely by the deadline having no preset-reachable authority over it:
#
#   * the official per-instance budget is 100 s and the internal tier is 95 s;
#   * the relational lane multiplies its branch-and-bound deadline by
#     `DEFAULT_REL_BAB_DEADLINE_MULT = 1.4` on purpose — this search is
#     NON-MONOTONIC in its own timeout, because every per-node CROWN-IBP grant
#     is a fraction of the budget still believed to REMAIN, so a nearer deadline
#     buys looser bounds, more splits and a non-converging tree;
#   * before `scored_wall_clamp` that inflated number was ALSO the stop, so on
#     the banked 50-row sweep EIGHTEEN rows ran past 95 s and were SIGKILLed by
#     the in-process watchdog at 105.0-105.1 s — 105 % of the official budget.
#     On the competition harness an external kill at 100 s leaves those rows
#     with NO verdict token at all, which scores worse than a timeout.
#
# `solver.scored_wall_clamp` separates the two numbers: effort keeps being
# shaped by the inflated horizon, the loop stops at an absolute instant derived
# once from the scored budget at the command anchor. It can only ever SHORTEN a
# run, and a shortened sound search returns `timeout`, never a verdict.
#
# A competition harness exports no `NY_*`, so this key is the only route by
# which the fix reaches a scored run. `NY_SCORED_WALL_CLAMP` remains an override
# in both directions for measurement.
#
# MEASUREMENT: reports/measured-2026/isomorphic_acasxu_2026_NOTES.md.

solver:
  scored_wall_clamp: true

attack:
  concurrent: true
  relational_point_vjp: true
