#
# cgan2026 VNN-COMP 2026 benchmark config
#
# Benchmark characteristics:
# - Conditional-GAN robustness with resampled 2026 properties. All eight model
#   names are byte-identical after decompression to cgan_2023's 2025 models, so
#   model-cost scheduling measurements transfer; solve rates do not. Seven are
#   tracked as .onnx.gz; setup materializes the small-transformer eighth model.
# - Architecture: Gemm -> Reshape -> ConvTranspose+BN+ReLU (gen) ->
#   Conv+ReLU+BN (disc) -> Gemm. Low-dim latent input, disjunctive output.
# - IMPORTANT: the name `cgan2026` has NO `_20NN` suffix, so the year-stripping
#   preset fallback does NOT map it to `cgan` — this explicit preset is REQUIRED
#   (without it cgan2026 silently runs on auto defaults with no tuning).
# - No audited cgan2026 solve-rate projection is retained. Do not transfer the
#   2025 result counts to these resampled properties.

general:
  # cgan2026 is a regular-track category, so the selected competition manifest
  # is VNN-LIB 1.0. The 1.0/2.0 instance-list blobs currently match, but retain
  # the voted version explicitly rather than relying on that incidental parity.
  root_path: ../../benchmarks/vnncomp2026/benchmarks/cgan2026/1.0
  csv_name: instances.csv
  device: wgpu

model:
  batch_norm_folding: preserve_raw
  require_authored_float32_initializers: true
  cgan_forward_alpha_surrogate: false

attack:
  pgd_order: before
  pgd_restarts: 200

bab:
  batch_size: 64
  # Same model-cost ceiling as cgan_2023. A missed CROWN walk falls back to its
  # sound IBP enclosure, so this controls time/tightness rather than authority.
  crown_ibp_per_node_cap_secs: 150
  phase_budget:
    # Attack caps are schedule-only: every SAT witness is still independently
    # validated, while an undiscovered witness falls through to proof search.
    disjunctive_pgd_fraction: 0.10
    disjunctive_pgd_max_secs: 5
    attack_extension_fraction: 0.0
    # The byte-identical models use the same fast cached forward-linear map.
    # These fractions remain generous ceilings rather than reserved spend.
    initial_bounds_fraction: 0.45
    disjunctive_precheck_fraction: 0.85
    # Spend the remaining official budget on the proof tree after upfront PGD.
    post_bab_pgd_fraction: 0.0
    # Match the measured cgan_2023 policy for the independent wrapper lane.
    vnncomp_post_bab_attack: false
  branching:
    method: input
    candidates: 5
    reduceop: max
    input_split:
      # Keep the eager best-first route; the reordered warm-parallel schedule
      # has not yet closed an official-budget cGAN row.
      reorder_bab: false
      # One warm step bounds per-domain refinement cost on the identical model.
      alpha_iteration: 1
      lr_alpha: 0.05
      # Both certified accelerators fail closed to their established scalar
      # paths on unsupported shapes or metadata.
      ibp_enhancement: true
      stacked_rebound: true
  clip:
    relaxed: true
    relaxed_iterations: 20
  alpha_crown:
    lr_alpha: 0.2
    iterations: 100
    # These models are byte-identical to the audited 2025 cGAN models. Reuse
    # the same certified root-only complete cascade; property resampling does
    # not affect its structural eligibility or soundness, and child domains
    # still clear the policy before taking the cheap forward-linear route.
    cgan_complete_crown_ibp_root: true
    # Aggregate scheduling-only ceiling shared with the byte-identical 2025
    # models; expiry retains the previous certified reference map.
    reference_refresh_max_secs: 12
    # The identical 2025/2026 models share the measured endgame cliff: after
    # forward-linear deadline refusal, select certified plain IBP directly.
    forward_linear_deadline_fallback_to_ibp: true
  beta_crown:
    lr_alpha: 0.1
    lr_beta: 0.15
    iterations: 25
