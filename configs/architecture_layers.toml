# Architecture Layer Policy
#
# Defines the target crate topology for ny (see docs/architecture-review-2026-02-07.md).
# Validated by scripts/check_architecture_layers.py.
#
# Part of #2126, Part of #1696
#
# Layer rules:
#   - Higher layers may depend on lower layers (L4 -> L3 -> L2 -> L1 -> L0).
#   - Same-layer dependencies are allowed (peer deps).
#   - Lower layers must NOT depend on higher layers (enforced).
#   - Dev-only dependencies follow the same layer rules, except that any layer
#     may use a sidecar crate for development/test support.
#   - Exceptions must be listed explicitly with an owner and tracking issue.

[layers]
# L0: Foundational contracts, types, traits, and errors
L0 = ["ny-contracts", "ny-core", "ny-levers"]

# L1: Tensor representation
L1 = ["ny-tensor"]

# L2: Verification, certificate, and acceleration engines
L2 = [
    "ny-accelerate",
    "ny-cert",
    "ny-cuda",
    "ny-gpu",
    "ny-gpu-passthrough",
    "ny-mip",
    "ny-propagate",
]

# L3: Graph construction, model integration, and reusable API surfaces
L3 = [
    "ny-api",
    "ny-build",
    "ny-groundtruth",
    "ny-load",
    "ny-onnx",
    "ny-trace-bridge",
]

# L4: End-user interfaces
L4 = ["ny-cli", "ny-python"]

# Sidecar: development and proof-support crates outside the runtime chain
sidecar = ["ny-lint-guard", "ny-relaxation", "ny-test-utils"]

# Sidecar crates may depend on any layer but are not checked for
# downward violations. They are excluded from default-members.

# Exceptions belong here only for intentional upward dependency edges. The
# validator rejects stale or unnecessary entries; the current graph needs none.
