  #
  # The two cgan entries that lived here are DELETED: both models load at HEAD.
  # The three-edit path this file wrote out on 2026-08-08 was implemented as
  # specified, and the escape hatch it warned about was NOT widened:
  #
  #   1. `require_static_source` accepts Add/Sub/Mul/Div through
  #      `require_all_inputs_static`. Safety is carried by the RECURSION, not
  #      by the operator list — every input must itself authenticate and the
  #      recursion bottoms out only at an initializer, `Constant` or `Shape`.
  #   2. `is_int64_layout_chain_input` accepts the same ops consumer-side.
  #   3. `validate_arithmetic_float32_data_path` consults the structural
  #      authentication, which `validate_structural_schemas` now returns as a
  #      `StructuralAuthentication` ledger. It does NOT admit the node: it
  #      DEFERS the FLOAT32 refusal into the `LiteralExemptions` ratchet, so
  #      the node is admitted only if constant folding actually erases it, and
  #      re-raises the original message verbatim if it survives.
  #
