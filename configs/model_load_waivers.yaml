# 2026-08-31 UPDATE — cctsdb Equal dtype-7 gate certified (819b0554 recovery)
# ===========================================================================
#
# PAID OFF: the patch-1.onnx entry is DELETED because the model LOADS at HEAD.
# The recovery is the certification design the pin test's own comment demanded,
# not a gate relaxation (#cctsdb-expand-identity + #cctsdb-trunc-gated-index in
# crates/ny-onnx/src/loader/parse/):
#
#   * the four dtype-7 Equals are PyTorch's `expand(-1,...)` keep-dims idiom
#     over a runtime shape — `Equal(Shape(grid), -1*ones)` is CONSTANT
#     all-false by ONNX semantics (dims are never negative); the loader
#     certifies exactly that authored cone, canonicalizes the paired Where to
#     Identity(Y), and deletes the constant-false comparison.  An uncertified
#     dtype-7 comparison refuses verbatim (pinned by unit negatives:
#     Equal(Shape, 0), Equal(runtime, runtime)).
#   * the runtime INT64 index chain (patch coords via Gather -> Cast(->INT64))
#     is admitted as a trunc-gated runtime index chain: every INT64 consumer
#     position is still bounded by the structural control audit, the casts
#     lower to guarded LayerType::Trunc, and range/exactness obligations are
#     discharged at solve time (bounded-index ScatterND, taint-gated degrade,
#     per-cell enumeration).
#
# STILL OWED: patch-3.onnx remains refused — but by a DIFFERENT, true residual,
# so its entry below is REWRITTEN rather than deleted: its zero-patch values
# tensor `ConstantOfShape_39` reads its shape from Shape(Slice(...)) whose
# bounds come from the runtime input; ONNX Slice clamps, so that tensor's
# EXTENT is genuinely runtime and the folder correctly cannot erase it
# ("survived constant folding on a live data path", gate 25dee0c5).  patch-1's
# equivalent cone has authored-constant bounds and folds to [1,3,64,64].
#
# RE-SWEEP, per this file's own rule: cctsdb_yolo_2023's banked rows were
# re-measured at HEAD on 2026-08-31 (verdict_row_moat, official budgets):
# patch-1's 8 banked-unsat rows recover, all sat rows hold, patch-3's 3
# banked-unsat rows remain honest drops covered by the entry below.
