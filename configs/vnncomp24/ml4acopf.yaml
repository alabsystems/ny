#
# ML4ACOPF VNN-COMP 2024 benchmark config (power flow prediction)
# Ported from alpha-beta-CROWN: complete_verifier/exp_configs/vnncomp24/ml4acopf.yaml
#
# Benchmark characteristics:
# - Dense MLPs with ReLU lookup tables
# - Requires aggressive PGD attack before verification
# - Benefits from high alpha-crown iterations with decay

general:
  root_path: ../../vnncomp2024_benchmarks/benchmarks/ml4acopf_2024
  csv_name: instances.csv

attack:
  pgd_order: before
  pgd_restarts: 50
  attack_tolerance: 0.0001

bab:
  batch_size: 8
  auto_enlarge_batch_size: true
  min_batch_size_ratio: 0.0
  early_stop_patience: 200
  branching:
    # ml4acopf contains element-wise variable*variable power-flow products
    # (Layer::MulBinary, McCormick-relaxed). These are now branchable: the
    # GenBaB nonlinear-split path scores each Mul input by the McCormick envelope
    # gap (ux-lx)(uy-ly)/4 and splits the wider input axis, so BaB can close the
    # relaxation gap that frozen root facets cannot. See
    # crates/ny-propagate/src/beta_crown/nonlinear_branching/{selector,bilinear}.rs.
    #
    # NOTE: routing this category to GenBaB at runtime additionally requires the
    # ny-cli preset->BranchingHeuristic::GenBaB wiring (apply.rs / parse_branching_
    # heuristic); until that lands, ml4acopf auto-routes to input-splitting
    # (input dim 22 <= INPUT_SPLIT_MAX_INPUT_DIM) and the Mul branching is exercised
    # via the GenBaB graph path when selected. The choice is SOUND either way:
    # branching only selects which sound sub-box to bound next, never a verdict.
    candidates: 100
    reduceop: max
    nonlinear_split:
      filter: true
      filter_beta: true
  alpha_crown:
    lr_alpha: 0.2
    lr_decay: 0.99
    iterations: 200
  beta_crown:
    lr_alpha: 0.5
    lr_beta: 0.5
    iterations: 50
  pruning_in_iteration: false
