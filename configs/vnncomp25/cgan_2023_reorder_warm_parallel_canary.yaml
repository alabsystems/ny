#
# Experimental cGAN row-7 canary. This deliberately mirrors cgan_2023.yaml
# except for the measured reordered-loop scheduling treatment:
#   bab.batch_size: 8
#   reorder_bab: true
#   warm_parallel: true
#
# Batch 64 breadth-expanded to 319 domains with 0 verified in 120 s. Batch 8
# reached 319 explored / 117 verified and reduced the mature queue from 104 to
# about 90 in the same diagnostic window. This remains a default-off canary
# until an exact official-budget row closes.
#
# It is not selected by the VNN-COMP cgan_2023 category automatically. A sealed
# A/B must copy this file over vnncomp25/cgan_2023.yaml in an isolated config
# tree and bind that tree through NY_MEASURE_CONFIGS_DIR.

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/cgan_2023
  csv_name: instances.csv
  # Mirrors production cgan_2023.yaml #cgan-abc-parity (2026-08-26): the
  # BaB-child-backward conv representation. See production for the measurement.
  conv_mode: matrix

solver:
  # Mirrors production: plain CROWN child bounds - the load-bearing key of
  # the 2026-08-26 conversion factorial. See production cgan_2023.yaml.
  bound_prop_method: crown

model:
  # #fl-s-shaped-untyped: MIRRORS the scored cgan preset. Present so this file
  # keeps its exact knob-delta / byte-identity invariant against cgan_2023.yaml,
  # which arms it on measured evidence (converts nonlinear_activations_prop_0
  # timeout@1195s -> unsat@83s 4/4; 18/18 banked verdicts held and every banked
  # unsat 12-50% FASTER). NOT this file's own axis.
  forward_linear_s_shaped_untyped: true
  batch_norm_folding: preserve_raw
  require_authored_float32_initializers: true
  cgan_forward_alpha_surrogate: false

attack:
  pgd_order: before
  pgd_restarts: 200

bab:
  batch_size: 8
  cgan_reclaim: true
  crown_ibp_per_node_cap_secs: 150
  phase_budget:
    disjunctive_pgd_fraction: 0.10
    disjunctive_pgd_max_secs: 5
    attack_extension_fraction: 0.0
    initial_bounds_fraction: 0.45
    disjunctive_precheck_fraction: 0.85
    # mirrors production (#precheck-abs-cap promoted to cgan_2023 2026-09-10)
    disjunctive_precheck_max_secs: 60
    post_bab_pgd_fraction: 0.0
    vnncomp_post_bab_attack: false
  branching:
    method: input
    candidates: 5
    input_split:
      # Mirrors production #cgan-abc-parity: sb selection threshold and the
      # periodic SAT-only probe (0 ENABLES; -1 disables).
      sb_coeff_thresh: 1.0e-2
      adv_check: 0
      reorder_bab: true
      warm_parallel: true
      alpha_iteration: 1
      lr_alpha: 0.05
      ibp_enhancement: true
      stacked_rebound: true
      # mirrors production (#cap-extend promoted 2026-09-10)
      cap_extend_near_closure: true
  clip:
    relaxed: true
    relaxed_iterations: 20
    # Mirrors production: the sound exact-domain input clip (abc's
    # clip_input_domain). See production cgan_2023.yaml for the contract.
    input_split_fresh_domain_clip: true
  alpha_crown:
    lr_alpha: 0.2
    cgan_complete_crown_ibp_root: true
    # #cgan-dense-root (MEASURED 2026-09-10, nCh_3 prop_0, GB10, zero NY_*): the CROWN-IBP collector's
    # forced PATCHES mode expires inside the ConvTranspose2d composition on the discriminator targets,
    # is salvaged by IBP and discarded, leaving Conv_14/16/19/22 at 536/369/736/512 unstable (abc: 59/18/
    # 12/6) and the root margin at -5.8945. Dense mode: cascade 82.8 s, every node's unstable count equal
    # to abc's, root [0.6358779, 0.6731632] (abc [0.6359, 0.6732]), margin -0.0034, then unsat in 148 s
    # of BaB. `cgan_crown_root_map` hands that map to the input-split BaB from the `crown` arm.
    cgan_collector_dense: true
    cgan_crown_root_map: true
    # #cgan-unstable-rows (MEASURED 2026-09-12, GB10, pinned fa34dcc37 build, official budgets, zero NY_*,
    # MemoryMax=96G cap-survival): seed each demanded ReLU-preactivation target's CROWN backward with ONLY
    # its baseline-unstable rows (abc's sparse_intermediate_bounds, minimum_sparsity 0.9). The cascade that
    # cost 245 s on the 64-px rows costs 73-120 s, BatchNormalization_13 (61,504 rows) completes in 4.4 s
    # instead of aborting to IBP, and Sz64 nCh_3 prop_3 converts timeout -> unsat 160.4/160.6/160.6 s (3/3);
    # 21-row moat, both arms, one hold: zero flips, all 12 sat and all 5 banked unsat rows held. Sound by
    # construction: unselected rows keep the certified baseline; a wrong mask is looser, never unsound.
    cgan_unstable_rows: true
    reference_refresh_max_secs: 12
    forward_linear_deadline_fallback_to_ibp: true
  beta_crown:
    iterations: 25
