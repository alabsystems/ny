#
# relusplitter VNN-COMP 2025 benchmark config
#
# Benchmark characteristics:
# - ReLU splitting benchmark: MNIST FC (256x4, 256x6), CIFAR CNNs (oval21, biasfield)
# - 220 instances: MNIST 80 + CIFAR oval21 60 + CIFAR biasfield 80
#   (each original model paired with RSPLITTER variant at 3x timeout)
# - Disjunctive output properties (multi-class classification)
# - ny measured: 82/220 (37%) on current HEAD (2026-03-13 re-confirmed)
#   MNIST 256x4 34/40, 256x6 10/40; CIFAR base_kw 13/20, deep_kw 8/20,
#   wide_kw 9/20, biasfield 8/80 (all counterexamples)
# - alpha-beta-CROWN reference: uses auto verifier (MIP+BaB), CPLEX cuts,
#   diversified_PGD attack, clip_input_domain
# - Gap vs reference:
#   * complete_verifier: auto (MIP fallback when BaB stalls) — not configured
#   * attack_mode: diversed_PGD — implemented (#1449)
#   * cplex_cuts: True, bab_cut: True — ny's legacy cut proof path is quarantined
#   * reorder_bab: True — not implemented in ny
#   * batch_size: 4 + auto_enlarge_batch_size: True — ny uses fixed 64
#   * start_save_best: -1 — not implemented
#   * sb_coeff_thresh: 2.0 (reference) vs not set (ny default)
# - Status: ENTRY READY (82/220). All algo blockers CLOSED (#523, #3397, #1074).
#   Re-probe 2026-03-13 MNIST 256x6: kFSB ~6 domains/sec, input-split ~1 dom/sec.
#   No improvement from algo closures (kFSB on CPU, not GPU/input-split path).
#   Feature gap: CPLEX cuts, GPU threading (#3597). Diversified PGD: #1449 CLOSED.
# - Biasfield timeout root cause (2026-03-14 analysis, Part of #3218):
#   Conv2d CROWN backward takes ~30s PER NODE on CPU for biasfield CNN models.
#   Deadline check in spec_propagation.rs:291 is per-node (between nodes), NOT
#   within a node — so a single Conv2d backward dominates the entire timeout.
#   Measured: 42.6s actual with 15s timeout (deadline overshoot 27.6s).
#   Config tuning (pgd_restarts, alpha_iterations) saves time in OTHER phases
#   but cannot bypass the Conv2d CROWN backward bottleneck.
#   RESOLVED: GPU CROWN backward with fused conv_transpose_2d now available (#3813).
#   Measured 19.8x speedup on soundnessbench-shaped 6-Conv2d workload (graph
#   CROWN-IBP collection: CPU 257.56s vs GPU 12.97s, March 15 2026).
#   Config changes below still help MNIST FC (verified 3x faster: 2.8s vs 8.14s)
#   and may help CIFAR oval21 (smaller Conv2d models with faster backward).

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/relusplitter
  csv_name: instances.csv
  # GPU CROWN backward for Conv2d-heavy biasfield models. Fused conv_transpose_2d
  # avoids the CPU 30s+ per-node bottleneck that caused #3813 timeouts.
  device: wgpu
  # Keep the measured dense-matrix Conv2d speedup independently of cuts.
  # Cut proof authority is quarantined below, so `auto` would otherwise fall
  # back to patches and reintroduce the per-node 30s+ bottleneck.
  conv_mode: matrix

attack:
  pgd_order: middle
  ny_pgd_order_compat: upfront
  # Reference: alpha-beta-CROWN relusplitter.yaml uses diversed_PGD (#1449).
  # OSI initialization pushes restart seeds toward diverse output regions.
  attack_mode: diversed_PGD
  # Reduced from 200: CNN biasfield forward passes are expensive (~1-5ms each);
  # 200 restarts x 20 steps consumes the entire 50% PGD deadline on CNN models.
  # 50 restarts is still sufficient for MNIST FC counterexamples (<0.5s total).
  pgd_restarts: 50

bab:
  # Reduced from 64: smaller batches make per-BaB-iteration faster for CNN models
  # (CROWN backward cost scales with batch size). Reference uses 4 + auto_enlarge.
  batch_size: 4
  # #3813: stop fixed-slope CROWN after the classifier tail and concretize the
  # remaining Conv2d trunk with sound forward bounds. This mirrors the
  # alpha-beta-CROWN fixed-intermediate-bound strategy and keeps RSPLITTER root
  # bounds from spending the full timeout in Conv2d backward.
  crown_backward_layers: 6
  branching:
    method: kfsb
    candidates: 10
    reduceop: max
  cuts:
    # Fail closed until proof-derived cuts are folded through backward CROWN.
    enabled: false
    near_miss: false
    near_miss_margin: 0.01
    proactive: false
  clip:
    relaxed: true
    relaxed_iterations: 20
    interm_domain: true
  alpha_crown:
    lr_alpha: 0.2
    # Reduced from 100: the dominant bottleneck for biasfield CNN 0-domain timeouts.
    # 2 passes x 100 iterations of CROWN backward on Conv2d graph models exhausts
    # 30s+. Alpha-CROWN converges in <10 iterations for FC models (MNIST unaffected).
    # For CNN models, 20 iterations provides useful bound tightening while leaving
    # budget for BaB. Reference does not set explicit iterations (uses default ~100)
    # but compensates with matrix Conv mode (fast backward) and auto_enlarge.
    iterations: 20
  beta_crown:
    lr_alpha: 0.1
    lr_beta: 0.01
    iterations: 15
  phase_budget:
    # #reclaim-pgd (measured 2026-08-01 at HEAD 533a3100, official budgets).
    #
    # The disjunctive PGD phase on this benchmark is RESTART-bound, not
    # fraction-bound: `attack.pgd_restarts: 50` above pairs with the default
    # `pgd_steps: 50` (never overridden here) across 9 clauses, and the lane stops
    # on restart exhaustion WITHOUT ever reaching its fractional deadline. Measured
    # phase duration vs the slice it was granted, on GT-unsat oval21 rows:
    #   deep_kw img6995            @60s   22.72s used of 30.0s granted (37.9% of budget)
    #   base_kw img2537            @60s   11.52s used of 30.0s granted (19.2%)
    #   deep_kw_RSPLITTER img6995  @180s  27.49s used of 90.0s granted (15.3%)
    #   base_kw_RSPLITTER img2537  @180s  17.63s used of 90.0s granted (9.8%)
    # So `disjunctive_pgd_fraction` is INERT here — halving it to 0.25 would still
    # grant 15s/45s, above three of the four measured costs — and the waste is
    # roughly CONSTANT in absolute terms. That is exactly the shape an absolute cap
    # is for; do NOT reach for the fraction instead.
    #
    # BaB re-bases on `PhaseBudgetLedger::remaining()`, so reclaimed seconds flow to
    # the search. Indicative (single-arm, contended host — NOT a validated A/B):
    # deep_kw img6995 @60s went 3511/3687 explored domains to 5287 under a 5s cap.
    # It converted ZERO rows; these instances are held by Conv2d CROWN throughput,
    # not falsification budget. Land this because it is free, then work the conv
    # wall — cifar100_2024.yaml:124-126 records the same lesson.
    #
    # KNOWN COUPLING, not a soundness issue: verify/disjunctive.rs derives the
    # concurrent forward-linear warmer's window as `min(pgd_deadline + 10s, overall)`,
    # so a tighter cap also shrinks that window and may make
    # `forward_linear_cold_build_admitted` decline on the conv rows (biasfield,
    # oval21). The warmer is a fail-closed CACHE — on refusal nothing is cached and
    # the verify phase recomputes the same certified bounds — so this can only trade
    # concurrency for serial time, never a bound. It partly offsets the reclaim on
    # conv rows, which is consistent with the measured domain gain being +43-51%
    # rather than proportional to the ~25s reclaimed. mnist_fc is unaffected (no
    # Conv2d, so no warmer) and 30s rows are unaffected entirely (see below).
    #
    # SAT COST: none measurable. All 20 GT-sat rows of the 220 are already ny-sat
    # and land via the exact-gradient lane far inside the cap (wide_kw img773 0.07s,
    # mnist-256x4_RSPLITTER prop_7 0.22s — a ~20x margin), and the 134-row
    # addressable pool contains NO GT-sat rows, so no reachable point can be traded
    # away. The cap bounds an ATTACK phase only: shortening falsification can lose a
    # counterexample (sat -> unknown, a completeness cost) and can never mint a
    # verdict, since no `unsat` is ever concluded from a failed attack.
    #
    # INERT ON THE 30s ROWS by design: the pre-existing small-budget attack cap
    # already holds a <=30s budget's attack slice to 0.15 * 30 = 4.5s, below this
    # ceiling, and a ceiling is a `min` — it can never LENGTHEN a phase. The budget
    # census of instances.csv is 30s x40, 60s x70, 90s x40, 180s x70, so the 40
    # base-mnist_fc rows at 30s are untouched; the cap binds only at 60/90/180s.
    # Pinned by `relusplitter_pgd_cap_reclaims_at_official_budgets`.
    disjunctive_pgd_max_secs: 5
