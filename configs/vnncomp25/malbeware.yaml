#
# malbeware VNN-COMP 2025 benchmark config
#
# Benchmark characteristics:
# - Malware image classification (MalImg dataset)
# - 3 models: linear-25 (4096→25), 4-25 (4096→256→128→25), 16-25 (4096→4096→256→25)
# - 150 instances (50 per model), all epsilon-ball properties (eps 1-3)
# - Input: flattened 64x64 grayscale images
# - ONNX ops: Conv → ReLU → Flatten → Gemm (all 3 variants have Conv)
# - STATUS: MIP with Conv2d→Linear unfolding enabled. Conv2d layers are
#   unfolded to equivalent dense Linear layers in mip_preprocess.rs (#3218).
#   Previous: BaB alone solved 129/150 (86%), 21 eps-3 needed MIP.
# - alpha-beta-CROWN reference: 150/150 using MIP (complete_verifier: mip)
#   alpha-beta-CROWN (github.com/Verified-Intelligence/alpha-beta-CROWN) complete_verifier/exp_configs/vnncomp25/malbeware.yaml
# - Reference uses pgd_order: after, pgd_restarts: 1000

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/malbeware
  csv_name: instances.csv
  # `complete_verifier` IS a typed preset key (`general.complete_verifier`,
  # preset/mod.rs; resolved in beta_crown/mod.rs `resolve_preset_complete_verifier`,
  # an explicit CLI `--complete-verifier` still wins). It is deliberately UNSET
  # here, i.e. `auto`.
  #
  # CORRECTION 2026-08-24 (#lever-reachability): the previous comment here said
  # "complete_verifier and mip_solver are passed via run_instance.sh CLI flags".
  # That is FALSE and has been for as long as the native entry point has existed.
  # `vnncomp_scripts/run_instance.sh` is a thin wrapper that execs `ny vnncomp`
  # and exports no `NY_*`; it passes no strategy flags at all. The scored path
  # hard-codes `CompleteVerifierArg::Auto`
  # (commands/vnncomp.rs), so the reference's `complete_verifier: mip` was never
  # in effect on this category. Verified with `ny vnncomp plan malbeware ...`,
  # which reports `complete_verifier = auto  [default]`.
  #
  # MEASURED 2026-08-24 — setting `mip` here is a NO-OP-to-harmful on THIS
  # category, and the reason is structural, not budgetary:
  #   beta_crown/routing.rs `route_conv_model_to_graph` returns `(true, true)`
  #   whenever `complete_verifier == Mip` AND the model has a Conv2d — malbeware
  #   has one in all 3 variants (`ny vnncomp plan` reports conv_layers = 1). That
  #   forces the model to load as a GRAPH, and `is_mip_only` (beta_crown/mod.rs)
  #   requires `BetaCrownModel::Sequential`. So asking for MIP is exactly what
  #   disqualifies the MIP-only route it was meant to enable: MIP still runs only
  #   as the post-BaB escalation, on the same slice `auto` already gives it.
  #   A/B on idx-82 (16-25, eps-3), same pinned binary, 100s: auto -> timeout,
  #   mip -> timeout, with ay MIP solves hitting their deadline in BOTH arms.
  # To route malbeware MIP-first, the conv->Graph rule would have to change; the
  # preset key alone cannot express it. Left at `auto` until then.
  #
  # mip_solver: also a typed key (`solver.mip.mip_solver`); unset = `ay`, which
  # is the only backend (docs/SOLVER_POLICY.md). Nothing to set.

attack:
  pgd_order: after
  ny_pgd_order_compat: upfront
  pgd_restarts: 1000

bab:
  batch_size: 64
  # Phase-budget rebalance for the 22 eps-2/eps-3 UNSAT timeouts (#malbeware-mip-budget).
  # Profile (4-25 Allaple.A eps-3 idx-11 @100s, 2026-07-10): disjunctive sampling
  # attack burned 47.5s (0.50 default) without a counterexample, multi-objective
  # BaB the next 40s without closing, and the MIP escalation started at ~89s with
  # a 23s clamp — it solved 24/24 clauses in ~12s wall but the per-clause slices
  # (~1s) cut the hard clauses, and the whole run overran the 100s scored budget.
  # The MIP formulation is already exact for this family in REAL arithmetic
  # (single Conv+ReLU+Gemm unfolds to Linear-ReLU-Linear; the first-layer
  # pre-activation bounds are the only Big-M constants). CORRECTION
  # 2026-09-12 (#mip-conv-sound-enclosure): "first-layer IBP pre-activation
  # bounds are exact on a box" was a real-arithmetic claim. In f32 the conv
  # output is a K-term round-to-nearest dot product, and the plain IBP
  # collector's Conv2d arm carried no directed rounding and no Higham
  # widening, so its box could sit INSIDE the true range and the exact solver
  # would then certify infeasibility of a model that excludes reachable points
  # (a minted unsat). The single-hidden fast path now collects with
  # `collect_ibp_bounds_sound` (certified Higham enclosure of the first affine
  # output, strictly wider-or-equal); it is still exact-on-the-box in the sense
  # that matters here — no CROWN/LP pass can tighten it soundly. The budget
  # routing below is unchanged:
  # - attack 0.50 -> 0.15: every measured sat row (4 in the scorecard + the
  #   newly-sat 16-25 idx-11) is found by the sampling attack in <0.5s; the 26
  #   passing unsat rows clustered at ~48-57s were attack-slice + <9s of real
  #   work, so they get FASTER (~15-25s).
  # - post_bab_pgd 0.10 -> 0.50: the multi-objective BaB lane keeps ~40s (no
  #   passing row needed more than ~9s of BaB); the reservation is consumed by
  #   the MIP escalation, which now starts at ~55s instead of ~89s.
  # - mip floor 0.25/30s -> 0.45/60s: the escalation gets ~42s inside the scored
  #   budget (per-clause adaptive slice ~1.75s growing as easy clauses close at
  #   ~0.4s), instead of 23s granted past the deadline.
  # Verdict-safe by construction: pure budget routing between sound engines.
  phase_budget:
    disjunctive_pgd_fraction: 0.15
    post_bab_pgd_fraction: 0.5
    mip_min_fraction: 0.45
    mip_max_secs: 60
  branching:
    # run_instance.sh overrides to kfsb via --branching CLI flag; preset uses
    # kfsb as the BaB fallback default. Reference uses MIP exclusively (no BaB).
    method: kfsb
    candidates: 5
    # Exact wave-selector mirrors for governed search; runtime is unchanged.
    kfsb_multi_candidates: 5
    kfsb_multi_reduceop: max
  clip:
    relaxed: true
    relaxed_iterations: 20
  alpha_crown:
    lr_alpha: 0.2
