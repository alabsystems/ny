# malbeware VNN-COMP 2025 benchmark config
#
# Benchmark characteristics:
# - Malware image classification (MalImg dataset)
# - 3 models: linear-25 (4096→25), 4-25 (4096→256→128→25), 16-25 (4096→4096→256→25)
# - 150 instances (50 per model), all epsilon-ball properties (eps 1-3)
# - Input: flattened 64x64 grayscale images
# - ONNX ops: Conv → ReLU → Flatten → Gemm (all 3 variants have Conv)
# - STATUS: MIP with Conv2d→Linear unfolding enabled. Conv2d layers are
#   unfolded to equivalent dense Linear layers in mip_preprocess.rs (#3218).
#   Previous: BaB alone solved 129/150 (86%), 21 eps-3 needed MIP.
# - alpha-beta-CROWN reference: 150/150 using MIP (complete_verifier: mip)
#   alpha-beta-CROWN (github.com/Verified-Intelligence/alpha-beta-CROWN) complete_verifier/exp_configs/vnncomp25/malbeware.yaml
# - Reference uses pgd_order: after, pgd_restarts: 1000

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/malbeware
  csv_name: instances.csv
  # complete_verifier and mip_solver are passed via run_instance.sh CLI flags,
  # not parsed by the preset loader. Documented here for reference.
  # complete_verifier: mip  (set in run_instance.sh)
  # mip_solver: ay          (set in run_instance.sh; SOLVER POLICY: ay only)

attack:
  pgd_order: after
  ny_pgd_order_compat: upfront
  pgd_restarts: 1000

bab:
  batch_size: 64
  # Phase-budget rebalance for the 22 eps-2/eps-3 UNSAT timeouts (#malbeware-mip-budget).
  # Profile (4-25 Allaple.A eps-3 idx-11 @100s, 2026-07-10): disjunctive sampling
  # attack burned 47.5s (0.50 default) without a counterexample, multi-objective
  # BaB the next 40s without closing, and the MIP escalation started at ~89s with
  # a 23s clamp — it solved 24/24 clauses in ~12s wall but the per-clause slices
  # (~1s) cut the hard clauses, and the whole run overran the 100s scored budget.
  # The MIP formulation is already exact for this family (single Conv+ReLU+Gemm
  # unfolds to Linear-ReLU-Linear; first-layer IBP pre-activation bounds are
  # exact on a box), so the fix is routing budget to the exact solver:
  # - attack 0.50 -> 0.15: every measured sat row (4 in the scorecard + the
  #   newly-sat 16-25 idx-11) is found by the sampling attack in <0.5s; the 26
  #   passing unsat rows clustered at ~48-57s were attack-slice + <9s of real
  #   work, so they get FASTER (~15-25s).
  # - post_bab_pgd 0.10 -> 0.50: the multi-objective BaB lane keeps ~40s (no
  #   passing row needed more than ~9s of BaB); the reservation is consumed by
  #   the MIP escalation, which now starts at ~55s instead of ~89s.
  # - mip floor 0.25/30s -> 0.45/60s: the escalation gets ~42s inside the scored
  #   budget (per-clause adaptive slice ~1.75s growing as easy clauses close at
  #   ~0.4s), instead of 23s granted past the deadline.
  # Verdict-safe by construction: pure budget routing between sound engines.
  phase_budget:
    disjunctive_pgd_fraction: 0.15
    post_bab_pgd_fraction: 0.5
    mip_min_fraction: 0.45
    mip_max_secs: 60
  branching:
    # run_instance.sh overrides to kfsb via --branching CLI flag; preset uses
    # kfsb as the BaB fallback default. Reference uses MIP exclusively (no BaB).
    method: kfsb
    candidates: 5
    reduceop: max
  clip:
    relaxed: true
    relaxed_iterations: 20
  alpha_crown:
    lr_alpha: 0.2
    iterations: 100
  beta_crown:
    lr_alpha: 0.1
    lr_beta: 0.15
    iterations: 15
