#
# safenlp_2024 VNN-COMP 2025 benchmark config
#
# *** THIS FILE IS SHADOWED AND NEVER LOADS (#preset-shadowing, 2026-08-24). ***
# The preset resolver searches `vnncomp*` directories NEWEST YEAR FIRST
# (crates/ny-cli/src/commands/vnncomp.rs `vnncomp_dirs_newest_first`), and
# configs/vnncomp26/safenlp_2024.yaml exists with the same category name — so
# EVERY run of category `safenlp_2024`, including the scored path, loads the
# vnncomp26 file. Verified: `ny vnncomp plan safenlp_2024 ...` prints
# `Loading preset: configs/vnncomp26/safenlp_2024.yaml`. Edits here are DEAD;
# an A/B arm patched only in this file measures as an exact placebo (this
# happened: 12 rows x 2 identical arms, bit-identical walls). Tune the
# vnncomp26 file instead, or delete this one.
#
# MEASURED 2026-08-24 while here (`general.complete_verifier: mip` in the
# LOADED vnncomp26 file, pinned 4250d245 mip,cuda binary, official 20s):
# the MIP-only route ENGAGES (sequential FC net -> run_mip_only; the
# [deadline-preserve] sequential-CROWN loop disappears, ay in-process solves
# run) and converts 0 of 12 open ruarobot/medical rows — every ay solve hits
# its deadline. The binding constraint is ay solve capability at this budget,
# not routing; matches docs/SAFENLP_AY_ARC_2026-08-20.md. Do not re-arm
# `complete_verifier: mip` as a routing fix.
#
# Benchmark characteristics:
# - SafeNLP: NLP safety verification instances
# - 1080 instances
# - Reference alpha-beta-CROWN config: complete_verifier=mip, pgd_restarts=10000
#   alpha-beta-CROWN (github.com/Verified-Intelligence/alpha-beta-CROWN) complete_verifier/exp_configs/vnncomp24/safenlp.yaml
# - Previous ny score: 735/1080 (68.1%) with BaB kfsb (345 unknown)
# - MIP route should recover most unknowns since these are small FC networks
# - Updated: Re: #3218, Re: #2569 — match reference config for breadth

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/safenlp_2024
  csv_name: instances.csv

attack:
  # Force the upfront falsification lane (#upfront-preset). safenlp specs are
  # single-constraint, so the auto multi-clause-disjunction rule skips them.
  # This used to live only as `NY_UPFRONT_ATTACK=1` in run_instance.sh, which
  # made every measurement path disagree with the submission path. MEASURED:
  # medical/hyperrectangle_2096 is `sat` at the official 20s budget with the
  # lane and `timeout` without it.
  upfront_attack: true
  pgd_order: after
  ny_pgd_order_compat: upfront
  pgd_restarts: 10000
