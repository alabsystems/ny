#
# safenlp_2024 VNN-COMP 2025 benchmark config
#
# Benchmark characteristics:
# - SafeNLP: NLP safety verification instances
# - 1080 instances
# - Reference alpha-beta-CROWN config: complete_verifier=mip, pgd_restarts=10000
#   alpha-beta-CROWN (github.com/Verified-Intelligence/alpha-beta-CROWN) complete_verifier/exp_configs/vnncomp24/safenlp.yaml
# - Previous ny score: 735/1080 (68.1%) with BaB kfsb (345 unknown)
# - MIP route should recover most unknowns since these are small FC networks
# - Updated: Re: #3218, Re: #2569 — match reference config for breadth

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/safenlp_2024
  csv_name: instances.csv

attack:
  # Force the upfront falsification lane (#upfront-preset). safenlp specs are
  # single-constraint, so the auto multi-clause-disjunction rule skips them.
  # This used to live only as `NY_UPFRONT_ATTACK=1` in run_instance.sh, which
  # made every measurement path disagree with the submission path. MEASURED:
  # medical/hyperrectangle_2096 is `sat` at the official 20s budget with the
  # lane and `timeout` without it.
  upfront_attack: true
  pgd_order: after
  ny_pgd_order_compat: upfront
  pgd_restarts: 10000
