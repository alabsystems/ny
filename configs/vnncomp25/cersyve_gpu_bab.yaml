#
# cersyve GPU-BaB sidecar for #3870 measurement runs.
# Keeps the main preset untouched while forcing the benchmark lane onto the
# DomainList path via `--gpu-bab`.
#
# NOTE: device: wgpu is intentionally NOT set for input-split benchmarks.
# For small models, WGPU kernel dispatch overhead (~1-5ms per call) dominates
# CPU CROWN backward pass cost (<0.01ms), causing a 300x throughput regression.
# Part of #3870.

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/cersyve
  csv_name: instances.csv

solver:
  batch_size: 500000
  min_batch_size_ratio: 0.1

attack:
  pgd_order: before
  pgd_restarts: 100

bab:
  batch_size: 500000
  branching:
    method: input
    candidates: 5
    reduceop: max
    input_split:
      enable: true
      sb_coeff_thresh: 1.0e-2
      sb_sum: true
      touch_zero_score: 0.1
      reorder_bab: true
      adv_check: -1
  clip:
    relaxed: true
    relaxed_iterations: 20
    clip_type: complete
  # Keep the #2206 competitive phase-budget tuning from the canonical preset.
  # This sidecar is loaded standalone via `--preset`, so it does not inherit
  # `cersyve.yaml` automatically.
  phase_budget:
    initial_bounds_fraction: 0.15
    post_bab_pgd_fraction: 0.10
  alpha_crown:
    lr_alpha: 0.2
    iterations: 100
  beta_crown:
    lr_alpha: 0.1
    lr_beta: 0.15
    iterations: 25
