# #lsnc-lane ARMED 2026-09-26 (ship/consolidate-2026-09-26): this file is byte-identical to the measurement config
# that produced the two-year moat (scratchpad/lsnclane/configs/vnncomp25/lsnc_relu.yaml) on ny-pins/ny_wave3_c5e9ce88f:
# 2026 79/80 (sat 11, unsat 68; +70, 0 lost, 0 sat<->unsat flips), 2025 80/80 (+69, 0 lost), CE-validity moat clean on
# both years' field scoring; end-to-end rows 23/79/2 unsat in 4.8/5.1/7.8 s of 25 s with '[lowdim] armed' + joint + clip.
# The lane-private interval twin (lowdim_interval_twin) is what makes the net boundable; the global
# NY_CONST_MATMUL_INTERVAL carrier stays EnvOnly/dark by policy (see the history below).
# Copyright 2026 Andrew Yates
# Author: Andrew Yates <andrewyates.name@gmail.com>
# SPDX-License-Identifier: Apache-2.0
#
# lsnc_relu VNN-COMP 2025 benchmark config
#
# Benchmark characteristics:
# - Lyapunov stability neural certificate (quadrotor, satellite, etc.)
# - Single shared model per system (relu_quadrotor2d_state.onnx, etc.)
# - 80 instances with 25s timeout each
# - Disjunctive output properties (multi-constraint clauses)
# - STATUS (2026-08-25, RE-MEASURED; the 2026-03-07 line below was FALSE on the
#   current binary and is kept only as the claim that was corrected):
#     "BaB runs but bounds too loose for UNSAT" — IT DOES NOT RUN AT ALL.
#   In the SHIPPED configuration (this preset, no NY_* levers, official 25 s
#   budget, through vnncomp_scripts/run_instance.sh) every lsnc_relu row that
#   PGD cannot falsify returns `unknown` from a HARD BOUND-PATH ERROR after
#   ~8.1 s, having explored ZERO domains:
#     Skipping unsupported layer /lyapunov/MatMul: two constant inputs that did
#       not fold (the exact-dot gate declined a rounded product)
#     -> GraphNetwork IBP: degrading tainted node '/MatMul' (BilinearCrown) ...
#        Invalid specification: MatMul requires at least 2D inputs
#     -> output node '/Concat_2' is tainted by an upstream OpaqueSkip
#     -> "Verification produced no verdict (sound unknown)"
#   Three both-constant MatMuls fail `try_fold_matmul_exact` on this model
#   (/lyapunov/MatMul, /controller/net/net/net.2_1/MatMul,
#   /dynamics_relu/model/model.0_1/MatMul); the Lyapunov matrix Q is lost and
#   the root bound is [-inf, +inf] on all 8 outputs. The ONLY mechanism that
#   makes this model boundable is NY_CONST_MATMUL_INTERVAL, which is
#   `Deliver::EnvOnly` by explicit soundness policy (space.rs, 43666c6b7) and
#   therefore CANNOT fire in competition. Every BaB tuning key below is
#   consequently DEAD in the scored lane — do not tune them against a
#   lever-armed measurement and call it a competition improvement.
#   Evidence: reports/measured-2026/lsnc_relu_artifacts/asymptotic_exactness/
# - (superseded) STATUS (2026-03-07): MulBinary CROWN + Gather CROWN working.
#   PGD finds ~10% SAT instances (1/9 in sample). BaB runs but bounds too loose
#   for UNSAT. Upgraded from 0% (error) to ~10% (PGD SAT) since MulBinary fix.
# - alpha-beta-CROWN reference: 75/75 (10 SAT, 65 UNSAT)
# - Reference uses plain CROWN (`bound_prop_method: crown`), SB-style input
#   splitting, relaxed input clipping (`clip_input_domain` default clip type),
#   batch_size=1M, and 10k PGD restarts.
# - ny keeps the existing input-split SB tuning and relaxed input
#   clipping surface (`bab.clip.relaxed: true`) while switching this preset to
#   plain CROWN and a higher PGD budget. Fresh rerun needed to measure the
#   current-head UNSAT impact.
# - Gap vs reference:
#   * pgd_restarts: 1000 — tuned down from reference 10000 to keep PGD under ~3s
#     (reference BaB is 100x faster so 10K restarts consume proportionally less budget)
#   * pgd_alpha: 0.01, pgd_alpha_scale: True — now mirrored in the preset
#   * branching.method: sb (reference) vs input (ny token for the same input-split path)

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/lsnc_relu
  csv_name: instances.csv

solver:
  batch_size: 1000000
  min_batch_size_ratio: 0.0
  bound_prop_method: crown

attack:
  pgd_order: before
  pgd_restarts: 1000
  pgd_steps: 100
  pgd_alpha: 0.01
  pgd_alpha_scale: true
  # #lsnc-attack-twin: the post-BaB tail runs exact-gradient PGD on a
  # POINT-FOLDED ATTACK TWIN of this net (its four constant-only MatMul cones
  # evaluated once by ONNX Runtime and baked in; the exact loader fails them
  # closed, which is what leaves every gradient lane statically dead here and
  # ~17 s of the 25 s budget unspent). Restarts alternate uniform / snapped
  # onto the face the disjunct's own target points at — the 2026 field
  # counterexamples for rows 14/17/58 sit on X_5 = +2. The twin is attack-only
  # (a distinct type with no route to a bound API); every candidate is ORT-
  # checked on the ORIGINAL model and re-gated by gate_sat_with_trusted_oracle,
  # so the key can only add sat verdicts. Governs 2025 and 2026 rows alike (no
  # vnncomp26 shadow): no witness is carried between rows or years.
  # NY_ATTACK_POINT_FOLDED_TWIN still overrides (exact 0 kills, exact 1 forces).
  point_folded_twin: true

bab:
  batch_size: 1000000
  branching:
    method: input
    candidates: 5
    input_split:
      enable: true
      sb_coeff_thresh: 1.0e-2
      sb_sum: true
      touch_zero_score: 0.1
      reorder_bab: true
      adv_check: -1
      ibp_enhancement: true
      # #lsnc-lane MEASUREMENT ARMING (scratchpad/lsnclane only; NOT the shipping
      # yaml): the lowdim prover on the grouped 13x3 disjunctive route, lowering
      # the LANE-PRIVATE interval twin of this net (bab.branching.input_split.
      # lowdim_interval_twin). The grouped search is vacuous on the real graph
      # (its OpaqueSkip cones bound to [-inf, inf]), so the lane gets 0.9 of the
      # BaB slice; every layer is <= 8 wide, so refinement is on at width 8.
      lowdim_prover: true
      lowdim_interval_twin: true
      lowdim_prover_share: 0.9
      lowdim_prover_refine_width: 8
      # #lsnc-lane stage 2 MEASUREMENT ARMING: the joint quadratic bound at the
      # V and dV ReduceSum(Mul) sites (bab.branching.input_split.
      # lowdim_joint_quadratic). Engagement: `[lowdim-joint] armed=1
      # source=Config` and `[lowdim] joint sites=2 armed=1 ... planes=1` at both
      # sites; the A/B arm deletes this one line.
      lowdim_joint_quadratic: true
      # #lsnc-lane stage 3 MEASUREMENT ARMING (the numpy gate's `allmax` stack):
      # the aspect-guarded `sbwr` split (gate: 2.0e5-1.4e6 domains/row vs
      # 3.1e5-3.7e6 for plain sb), the relaxed clip of each box by its OWN
      # passes' planes (outward rounded; never a parent's plane), and deciding
      # each domain inside the rayon tasks (outcome-identical, throughput only).
      # Engagement: `[lowdim-split] armed=1 value=sbwr source=Config`,
      # `[lowdim-clip] armed=1`, `[lowdim-parallel] armed=1`, then
      # `[lowdim] lane-config split=sbwr clip=1 joint=1 parallel=full threads=T`
      # and per clause `clip_closed=.. clip_shrunk=.. joint_sites=2 joint_hits=..`.
      # A/B arms delete one line each (split -> widest by deletion).
      lowdim_split: sbwr
      lowdim_clip: true
      lowdim_parallel: true
  clip:
    relaxed: true
    relaxed_iterations: 20
  phase_budget:
    initial_bounds_fraction: 1.0
    post_bab_pgd_fraction: 0.10
    # #attack-floor: the tiny-budget rule caps every attack phase at 15% of a
    # <= 30s budget, i.e. 3.0s of lsnc's 20s internal budget. MEASURED on this
    # category that cap is pure loss:
    #  * BaB has NEVER produced an unsat here (0/80 rows, this ledger and the
    #    preset note above); on quadrotor2d_state_34 it doubles its input-split
    #    queue to 30,762 domains and then dies INSIDE a batch on the wall
    #    deadline, so `verify_multi_clause_disjunction` returns Err and the run
    #    yields NO verdict at all (not even a near-miss witness to seed the
    #    post-BaB lane, which on this net is dead anyway — the model is outside
    #    the exact-gradient fragment).
    #  * The disjunctive PGD lands state_34's ORT-confirmed counterexample at
    #    ~4.54s into the phase — 1.54s past the cap. MEASURED cliff: a 4s floor
    #    still returns `unknown` 2/2, a 5s floor returns `sat` 3/3. 8s is chosen
    #    over 5s for headroom on a shared box (~76% vs ~10%); the floor is
    #    clamped to total/2, so BaB still keeps 10s of the 18s it had and the
    #    whole-category sweep shows no row paying for it (0 unsat either way).
    # #lsnc-lane stage 3 MEASUREMENT DIR ONLY: the floor is DROPPED here. That
    # rationale ("BaB has NEVER produced an unsat here") is what the lowdim
    # lane changes: the lane is throughput-bound (every unsat row needs
    # ~2e5-1.4e6 domains), and the 8 s floor takes ~5 s of lane time from
    # every row, sat or unsat. Without it the tiny-budget rule caps the attack
    # at 15% (3.0 s of 20 s). COST TO WATCH: the banked sats found at ~3-4.5 s
    # (rows 61/44 ~3 s; the state_34 cliff at 4-5 s measured above) — the moat
    # step of the stage-3 runbook re-measures every banked sat 3x with and
    # without this line before anything ships. Restore by uncommenting:
    # disjunctive_pgd_min_secs: 8
