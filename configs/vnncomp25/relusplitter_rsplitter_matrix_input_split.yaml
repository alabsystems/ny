#
# relusplitter RSPLITTER biasfield matrix-mode input-split sidecar preset
#
# Stage 1 of the #3813 IBP-first input-split design: force conv_mode=matrix
# so the no-cuts input-split lane does not silently fall back to the already-
# falsified patches regime. Measures whether matrix Conv2d backward alone
# unblocks the RSPLITTER biasfield row from the domains=0 stall.
#
# Part of #3813: stage-gated matrix input split.
# Design: designs/2026-03-14-issue-3813-ibp-first-input-split-alternative.md
#
# Reference:
# alpha-beta-CROWN (github.com/Verified-Intelligence/alpha-beta-CROWN) complete_verifier/exp_configs/vnncomp22/cifar_biasfield.yaml

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/relusplitter
  csv_name: instances.csv
  conv_mode: matrix

solver:
  batch_size: 4
  bound_prop_method: crown

attack:
  pgd_order: after
  ny_pgd_order_compat: upfront
  pgd_restarts: 300
  pgd_steps: 20

bab:
  branching:
    method: sb
    input_split:
      enable: true
      sb_coeff_thresh: 2.0
