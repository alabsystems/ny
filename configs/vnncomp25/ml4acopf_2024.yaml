#
# ml4acopf_2024 VNN-COMP 2025 benchmark config
# Ported from alpha-beta-CROWN: complete_verifier/exp_configs/vnncomp24/ml4acopf.yaml
# ny adaptation: DAG verification requires input splitting after #3602.
#
# Benchmark characteristics:
# - Dense power-flow MLPs with skip connections and Floor/Div subgraphs
# - 69 instances with 600s timeouts
# - Alpha/beta tuning is substantially heavier than the small MLP presets

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/ml4acopf_2024
  csv_name: instances.csv

attack:
  pgd_order: before
  pgd_restarts: 50
  attack_tolerance: 0.0001
  # #ml4acopf-upfront-single — the prop2 rows are ONE-constraint threshold specs
  # (`(assert (>= Y_2382 0.99))` on 300_ieee, a thermal-limit output), so the
  # automatic upfront rule (multi-clause disjunctions only) never admitted them:
  # 300_ieee lin-res prop2 printed no `Upfront attack:` line and was found only by
  # the post-BaB lane at sat@582.8 s of 600, and 300_ieee base prop2 ended
  # unknown@595 (pin af24b7593, scratchpad/refine2/av_{2,3}.raw). alpha-beta-CROWN
  # finds all three 300_ieee prop2 sats in 6.1-6.2 s wall (0.5-0.6 s of attack)
  # with exactly this recipe: `pgd_order: before`, 50 restarts, hinge loss.
  #
  # `upfront_attack: true` admits the single-clause rows. On a single-output
  # constant threshold the lane ascends the raw margin (= abc's hinge below the
  # threshold) on every restart instead of the margin/DLR ensemble, whose DLR
  # term there ascends Y_pi1 - Y_pi3, two outputs the property never reads.
  # Multi-clause rows (prop1, prop3-14, prop105) KEEP their automatic admission,
  # their 4 s `upfront_attack_auto_cap_secs` clamp and their loss ensemble: this
  # key does not un-clamp them, so every banked sat (all multi-clause) and every
  # multi-clause unsat runs the same upfront slice as before.
  #
  # 45 s: the effective window is min(cap, 0.08 x live remaining) and 0.08 x the
  # ~570-597 s remaining is 45.4-47.5 s, so the cap and the fraction nearly
  # coincide. Measured cost of this lane on 300_ieee is 23 ms (base) to 89 ms
  # (lin-res) per exact-gradient step, i.e. roughly 4-15 restarts of <=120 steps
  # in 45 s. The only rows that pay the full 45 s are the single-clause (prop2)
  # rows it does not falsify: 14_ieee (banked unsat at 3-11 s), 118_ieee (banked
  # unknown/timeout) and any 300_ieee prop2 it misses. 300_ieee lin-res prop2 is
  # the one banked verdict inside 45 s of the budget (sat@582.8 s, post-BaB
  # lane). The upfront seconds are charged to BaB's internal timeout, not to the
  # post-BaB window, but BaB's seed and frontier feed that lane's restarts, so
  # the measurement must show that row still sat. Every witness still passes
  # gate_sat_with_trusted_oracle.
  # DISARMED 2026-09-26 (M1, pin ny_wave3_c5e9ce88f): the lane ENGAGED on all three 300_ieee prop2 rows
  # ([upfront-loss] schedule=margin_only, 45 s, up to 1963 gradient steps) and found NONE of the three sats
  # (base/lin-nonres timeout@595, lin-res still sat only via the post-BaB lane @586.9 s), so it only costs
  # 45 s per single-clause row. The code stays (feat/ml4acopf-upfront-single); the attack itself is the gap.
  # RE-ARMED 2026-09-26 with #attack-vertex-geometry (wave-6 C3: abc's global scalar sign step, alpha = max_eps/4, flips
  # most dimensions vertex-to-vertex). W6B on ny_wave6_cf376ec20 (official 600 s): all three 300_ieee prop2 rows sat 3/3 —
  # base 0.97 s, -linear-nonresidual 6.6-6.8 s, -linear-residual 6.4-6.5 s (bank: unknown / sat only at 584 s); every
  # witness still passes gate_sat_with_trusted_oracle. Cap 20 s (the C3 measurement's value).
  upfront_attack: true
  upfront_attack_cap_secs: 20
  upfront_step_geometry: global_max_eps

bab:
  # #budget-abandonment FIX A + FIX B, armed 2026-09-13 after an 84-row
  # two-year moat (held=72, held_not_exercised=12, lost=0, marginal=0,
  # emergency=0, regression=0) and a 3/3 conversion.
  #
  # FIX A: the iterative root alpha-CROWN warmup is capped at
  # `initial_bounds_fraction` (0.20) of the BaB deadline, and before this key
  # an expiry THERE returned Unknown and BaB never started -- even though the
  # mandatory node sweep had already finished and its certified output-node
  # enclosure was in hand. Measured at HEAD on 14_ieee: bootstrap 0 -> 121.0 s
  # against a 114 s cap, 449 s of the 600 s budget abandoned. A wider root can
  # only make domain_is_verified / domain_is_violation HARDER to satisfy, so
  # it mints neither an unsat nor a spurious violation -- only more search.
  #
  # FIX B: the per-clause budget allocator is ONE pass and back-loads it
  # (`remaining / remaining_clauses`), so the FIRST clauses get the SMALLEST
  # slice and the failures concentrate exactly there. Measured on 14_ieee
  # prop1 (56 OR-clauses): clause 1 got 10 s and died, clause 56 got 442 s
  # and used 2.1 s, and the row ended with 470 s of 600 unspent. Retry passes
  # are bounded by bab_deadline(), which already reserves the post-BaB PGD
  # slice and the Graph-MIP escalation wall, and a retry can never erase a
  # recorded potential violation.
  #
  # MEASURED CONVERSION: 118_ieee_ml4acopf-linear-residual / 118_ieee_prop6
  # (2026 corpus, 600 s) unknown@141.5-141.8 s -> unsat@144.4-145.1 s, 3/3
  # armed with the fallback fired, 3/3 control unknown.
  initial_bounds_warmup_fallback: true
  disjunctive_clause_retry_passes: 2
  # #pwl-lookup (wave-6 C1): intersect each ReLU lookup table's IBP box with its exact 1-D range (outward-rounded
  # f64; shrink-only; an empty intersection keeps the plain box and prints CONTRADICTION). MEASURED 2026-09-26 on
  # ny_wave6_cf376ec20 (scratchpad/w6b): all 12 '-linear-*' prop3/prop4 rows (14/118/300 bus, lres/lnon) unsat in
  # 1.0-4.1 s (bank: unknown at the 596 s budget), contradiction=0 on every call.
  pwl_lookup_exact_range: true
  batch_size: 8
  # #ml4acopf-depth-cap — MEASURED 2026-09-21/22, and the reason is that this
  # preset never set a depth cap at all, so the category inherited the GLOBAL
  # default of 100.
  #
  # The dose-response on `118_ieee_ml4acopf-linear-nonresidual x
  # 118_ieee_prop6` at the official 600 s budget:
  #     max_depth    100 (default)   wall   9.91s   98.3% unspent  "Max depth 100 reached"
  #     max_depth  2 000             wall  47.10s   92.1% unspent  "Max depth 2000 reached"
  #     max_depth100 000             wall 244.07s              ->  **unsat**
  # Replicated 4/4 (244.07, 247.11, 242.12, 243.39 s), banked `unknown@283.0s`.
  # The proof was REACHABLE all along and the cap was severing it: the converted
  # run finishes FASTER than the banked unknown's own wall.
  #
  # WHY THIS CANNOT LOSE A BANKED ROW. Raising a depth cap cannot change a run
  # that never reached it, and a run that returns `unsat` closed its whole tree
  # before the cap by definition — "Max depth N reached" is a stop reason that
  # yields `unknown`. So all 43 banked unsat and 2 sat rows execute identically.
  # Only the rows being cut off change, and those score zero today.
  #
  # MEMORY is guarded by `bab.max_queue_bytes` below, which is the limit this
  # benchmark's own measurement chose after a COUNT-based cap authorised a
  # 137 GB queue and produced a 116.3 GiB RSS SIGKILL. Depth 100 was doing no
  # work that byte cap is not already doing.
  max_depth: 100000
  auto_enlarge_batch_size: true
  # #ml4acopf-bab-queue-mem — REQUIRED companion to alpha_crown.fix_interm_bounds
  # below. Byte cap on the resident graph ReLU-split BaB queue.
  #
  # WHY: one GraphBabDomain owns a full copy of the per-node bounds map plus its
  # per-neuron α state. MEASURED per-domain footprint on this benchmark:
  # 14_ieee-linear-residual 0.107 MB, 118_ieee_ml4acopf 0.159 MB,
  # 300_ieee_ml4acopf 0.368 MB, 118_ieee-linear-residual 1.372 MB,
  # 118_ieee-linear-nonresidual 1.613 MB. The shipped limits are COUNT based
  # (max_domains = 100,000; max_queue_size = 500,000 and that one is not even
  # wired to this heap), so on 118_ieee-linear-residual the queue is authorized
  # to reach 100,000 x 1.372 MB = 137 GB and the host OOM-killer arrives first:
  # MEASURED 116.3 GiB RSS at 81,920 resident domains, rc=137 (SIGKILL), with
  # the queue accounting for 96% of the footprint (112.44 GB of domain state vs
  # 117.32 GB RSS) while the whole O(N²) CROWN-IBP/α intermediate machinery
  # peaks at 2.86 GiB.
  #
  # 2 GiB is the queue cap; a popped wave may hold a further 1/4 of it, so the
  # transient (queue + wave + that wave's children) peak is ~1.75x = 3.5 GiB.
  # MEASURED with this value on 118_ieee-linear-residual / 118_ieee_prop2 at the
  # official 600 s budget: steady-state queue 1,366-1,370 domains, 1.878 GB of
  # domain state, 391 domains evicted per wave, `unknown` rc=0 in 310.9 s at a
  # 3.77 GiB peak — versus rc=137 (SIGKILL) at 116.3 GiB without it.
  #
  # SOUND: eviction never touches a bound. It only drops unexplored, unverified
  # sub-boxes, which latches `unresolved_due_to_eviction` and forces the run to
  # `unknown` instead of `Verified`. It costs completeness, never soundness.
  #
  # COSTS NOTHING HERE: the instances this benchmark actually converts resolve at
  # the root (0 BaB waves) or branch serially at queue_len = 1, so the cap never
  # engages on them — MEASURED A/B, unlimited vs capped, same verdicts.
  max_queue_bytes: 2147483648
  min_batch_size_ratio: 0.0
  early_stop_patience: 200
  branching:
    # method: nonlinear selects GenBaB branching (mirrors alpha-beta-CROWN's
    # ml4acopf.yaml). ml4acopf's element-wise variable*variable power-flow
    # products (Layer::MulBinary) are branched via the GenBaB nonlinear-split
    # path: each Mul input is scored by the McCormick envelope gap
    # (ux-lx)(uy-ly)/4 and the wider input axis is split, letting BaB close the
    # bilinear relaxation gap. Input splitting cannot touch this nonlinear
    # product frontier (measured: method: input yields unknown on abc-solvable
    # instances; see #ml4acopf-genbab). SOUND either way: branching only picks
    # which sound sub-box to bound next, never a verdict.
    method: nonlinear
    candidates: 100
    nonlinear_split:
      filter: true
      filter_beta: true
      # #genbab-selector-convention: abc's GenBaB candidate budget, delivered to
      # the GenBaB selector (`NonlinearBranchingConfig::num_candidates`).
      # `branching.candidates` above lands on fsb_candidates, which no GenBaB
      # lane reads. VALUE-NEUTRAL TODAY: both GenBaB consumers branch on
      # decisions[0] and the score sort is stable, so the chosen split is the
      # same at 1 and at 100 (pinned by
      # nonlinear_branching::tests::convention::genbab_top_decision_is_independent_of_num_candidates).
      # It becomes load-bearing only when a consumer reads decisions[1..] —
      # the BBPS filter that `filter`/`filter_beta` ask for, still unbuilt.
      num_candidates: 100
  alpha_crown:
    lr_alpha: 0.2
    lr_decay: 0.99
    iterations: 200
    # Recompute INTERMEDIATE node bounds with CROWN-IBP instead of reusing the
    # cheap IBP forward pass (α,β-CROWN's fix_interm_bounds=False; the ny CLI
    # flag is --crown-ibp-intermediates).
    #
    # MEASURED on 14_ieee_ml4acopf-linear-residual / prop9: the input box is
    # tiny (mean width 0.0015) and the true Y_159 range over it is
    # [-0.00236, -0.00068] (ORT, 4000 samples) against a ±0.01 property. With
    # IBP intermediates the ROOT objective bound is [-2.2110631, 3.6205366] —
    # ~3,400x wider than truth, and BaB cannot close that: branching refines
    # the INPUT box, not the intermediate relaxations that produced the gap.
    # With CROWN-IBP intermediates the same root tightens to
    # [-0.00013195918, 0.003164109], which discharges both disjunctive clauses
    # outright. This benchmark's 94-node DAG is small enough that the O(N²)
    # per-node sweep is affordable inside the 600 s budget.
    #
    # SOUND either way: both modes produce valid outer bounds; this only
    # chooses how much work is spent tightening them.
    #
    # RELEASED 2026-07-26 (#ml4acopf-bab-queue-mem). This key was HELD because
    # 118_ieee_ml4acopf-linear-residual / 118_ieee_prop2 peaked at 111.7 GiB RSS
    # and was SIGKILLed (rc=137) on this 121 GiB box whenever it was set.
    #
    # The blowup was NOT in the CROWN-IBP sweep. Phase-split measurement (RSS
    # sampler vs log timestamps) put the whole pre-BaB pipeline — model load,
    # CROWN-IBP reference collection, the α-CROWN loop and the post-optimisation
    # O(N²) `collect_crown_bounds_with_alpha` sweep — at 2.86 GiB, i.e. 2.4% of
    # peak; the remaining 97.6% was an UNBOUNDED branch-and-bound domain queue.
    # This key is the ENABLER, not the allocator: it makes the root bound finite,
    # which lets a hopeless BaB actually run (with fix_interm_bounds: true the
    # same instance dies in the first wave on NaN/±inf bounds after 1.4 s).
    # `bab.max_queue_bytes` above bounds that queue; with it, the same instance
    # runs to a clean `unknown` (rc=0) in 310.9 s at a 3.77 GiB peak.
    #
    # MEASURED 2026-07-25: with this key set, the full 69-instance sweep solves
    # 44/69 (vs 3/31 banked) with ZERO ground-truth mismatches.
    # The ~89 normalized points in this category are inseparable from this key:
    # the objective-direction repair alone converts nothing here (prop9/prop14
    # stay unknown without it).
    fix_interm_bounds: false
  beta_crown:
    lr_alpha: 0.5
    lr_beta: 0.5
    iterations: 50
  pruning_in_iteration: false
