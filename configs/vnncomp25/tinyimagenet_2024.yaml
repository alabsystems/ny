# tinyimagenet_2024 VNN-COMP 2025 benchmark config
# Ported from alpha-beta-CROWN: complete_verifier/exp_configs/vnncomp25/tinyimagenet.yaml
# Renamed from tinyimagenet.yaml to match category name (#3593)
#
# Benchmark characteristics:
# - Large image classification ResNets (DAG topology, residual skip connections)
# - High-dimensional inputs: the shipped TinyImageNet_resnet_medium.onnx takes
#   1x3x56x56 = 9408 elements (NOT the 64x64x3 the benchmark name suggests;
#   corrected from the ONNX graph input, which the branching note below already
#   quoted correctly as 9408)
# - Benefits from aggressive batching
# - ny: graph kFSB with child evaluation (#4300)
# - Reference uses kfsb (alpha-beta-CROWN supports kfsb on DAG models natively)

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/tinyimagenet_2024
  csv_name: instances.csv
  device: wgpu

attack:
  pgd_order: middle
  ny_pgd_order_compat: upfront
  pgd_restarts: 10
  pgd_restart_when_stuck: true

# MARGIN-ROW TWIN-WALL LANE (#twinwall-provenance, measured 2026-08-03, GB10)
#
# THE PROVENANCE PROBLEM THIS FIXES. Every one of this category's 67 banked
# `unsat` rows came from adee6117, whose body records the sweep it was gathered
# with: `NY_ROOT_BLAS=1 NY_MARGIN_ROW_PARALLEL=1 reserve=82`. Both env vars are
# compiled defaults now (7b004fba, 5ec405c4) and are no-ops — but the sweep was
# the margin-row BATCH RUNNER (`sweep_targets`, `ny vnncomp-research margin-row
# sweep`), which calls `run_margin_row_lane` DIRECTLY with the full 100 s and no
# harness at all. Its own ledger diff says so:
#     -...prop_idx_9419...,0,timeout,92
#     +...prop_idx_9419...,0,unsat,53
# i.e. the harness had already measured that row as a timeout and the bank
# overwrote it with the bare lane's verdict. So the numbers in column 6 are PURE
# LANE seconds, and the smallest of the 67 is 50 s.
#
# Through `ny vnncomp` the lane gets `margin_row.reserve_secs` and nothing else,
# and that slice only STARTS once the internal verifier gives up. The shipped
# default is 45 s. 45 < 50, so not one of the 67 rows can fit at ANY load, on
# ANY binary — which is exactly what the 2026-08-02 honest table found (67 of 67
# lost, zero verdict flips). Confirmed directly: the bank's own binary
# (adee6117, rebuilt here) with the bank's own env at the official 100 s budget
# still returns `timeout` on prop_idx_5478. There is no regression to bisect.
#
# THE FIX, MEASURED. Two keys, both sound, both preset-scoped:
#   * concurrent: true  — the lane runs from instance start alongside the
#     verifier instead of on its leftovers, which is the only shipped way to
#     hand it the budget its bank measured. Fail-closed: it returns `unsat` or
#     nothing, and its verdict is consumed only if the verifier came back
#     undecided, so it cannot cost a `sat`.
#   * root_f32: true — the 9409-wide root tableau's forward conv is
#     memory-bandwidth-bound and is ~99% of the lane's wall time (measured:
#     lane 128.8 s, of which the BaB tree is 0.5 s / 2 expansions). The sound
#     f32 path (50c044f5) halves the streamed width and charges every f32
#     rounding into a certified additive concretize slack — pure loosening, so
#     it can lose a proof but never invent one.
#     STALE PARENTHETICAL (2026-08-24): "the BaB tree is 0.5 s / 2 expansions"
#     was measured on the f64 lane BEFORE root_f32 shipped, and it is quoted in
#     three more places in this file as if it were a property of the category.
#     On the current binary the tree is 117+ expansions over ~40 s of a 93.2 s
#     lane, reaching depth 8 and open 48. The root_f32 DECISION is unaffected —
#     it was measured on its own A/B (prop_idx_5478 timeout -> UNSAT) — but the
#     "~99% of the lane" framing is not the current split, which is root build
#     48.9 s vs tree ~40 s. Root-build seconds are the currency on this
#     category; see the correction block under `bi_secs` below.
#
# A/B on prop_idx_5478 at the official 100 s budget through `ny vnncomp`:
#     concurrent, f64 root   -> timeout (load 6.8)
#     concurrent, f32 root   -> UNSAT, lane 58.1 s, wall 90.4 s (load 14.7)
# `reserve_secs: 0` is required with `concurrent`: keeping a reserve would tax
# the verifier twice (it loses the slice AND contends), the combination
# 31949bcc refused for want of evidence.
margin_row:
  # #breakpoint-dual: user-directed default activation for this category in
  # both the 2025 and 2026 routes. Four untrusted search steps feed the existing
  # certified node evaluator. The automatic tier uses at most 4 s / 5% of
  # remaining time, 8192 nodes per objective and 256 MiB of state. Dense row
  # estimates >=64 MiB select one objective, otherwise at most two.
  # Competition benefit and a full both-year regression comparison remain unmeasured.
  frozen_dual_bab: true
  frozen_dual_refine_steps: 4
  # #mr-stack + #mr-errlane (throughput plan B5 + B3) ARMED 2026-09-26 on the scratchpad/mrab A/B (pin ny_wave5_b44d1404b,
  # official 100 s, 3 reps x {ctl, stack, stack+envelope}): cifar100 idx_2050 and idx_4921 timeout 3/3 -> UNSAT 3/3; idx_1298
  # 91 -> 68 s, idx_3894 93 -> 71 s, idx_7258 61 -> 47 s; tiny idx_2146/7943 +54-106% tree expansions (no verdict change).
  # Stacking ALONE loses rows (3894 unknown 3/3) — only the pair ships. The envelope dominates the per-column penalty
  # (worst max_pen_env 6.0e-9); stacking is bit-identical.
  domain_stack: true
  err_envelope: envelope
  # #k-trunk-narrow ARMED 2026-09-16 — the branch shortlist was scoring seven
  # trunk candidates per expansion that essentially never win.
  #
  # EVIDENCE. The first tinyimagenet margin-row phase profile (obtainable only
  # after fixing a profiler blind on this category's exit path) shows
  # `score_candidates` is the LARGEST phase here — 50.4% / 52.2% of the lane at
  # 4852-9417 ms/call, against 21.8% on cifar100 — and it builds ONE wide seed
  # over both candidate kinds, `total = (2*n_t + 2*n_h)*nf`. Across the two
  # profiled rows, `trunk_split=0` over 214 splits: every split was a HEAD split.
  # k_trunk 8 -> 1 cuts that seed 32*nf -> 18*nf.
  #
  # MEASURED, one pinned binary, official 100 s, zero NY_*:
  #   THROUGHPUT  +49% expansions over 5 paired rows (399 -> 595); per-call cost
  #     1.33-1.57x cheaper against 1.78x predicted from the seed width.
  #   CONVERSION  idx_2045_sidx_7367 timeout -> unsat, CONTROL-VERIFIED:
  #     ctl 2/2 timeout@100s (cands=16), arm 2/2 unsat@95-96s (cands=9).
  #     The bank was `inherited-unverified`, so the controls rule out a stale
  #     bank. SOUND: the official corpus has 6 unsat / 6 timeout / 4 unknown and
  #     ZERO sat for this instance.
  #   MOAT  18 banked unsats clean (15 wide + 3 paired), 0 lost, 0 sat. Three of
  #     them expansion-IDENTICAL, including idx_4871 — the knife-edge row that
  #     k16 previously LOST.
  #   RARITY  1 conversion in 25 candidate rows. Worth ONE row (+0.571), not a
  #     front.
  #
  # Narrowing does NOT suppress trunk branching: on rows that use it, splits went
  # 12 -> 10 and 22 -> 24 (more, because the arm affords more expansions). The
  # top-ranked trunk candidate is usually the one that would have won anyway.
  k_trunk: 1
  # #backward-interm — shipped on TINY'S OWN evidence (alloc-trio rule: never
  # a blind cifar transfer). MEASURED 2026-08-19, official 100s, this preset:
  #   idx_4330 timeout -> UNSAT 3/3 (~37s, ledger); in-band roots tighten
  #   (idx_2146 -0.337 -> -0.323 etc.); SHIP GATE zero regressions on the
  #   pre-registered at-risk list (11 slow/flaky banked unsats x3: 7689/4674/
  #   4500/1496/1759/3115/4528/9535/6679/7403/5478) + sat sentinels
  #   6827/9558/6252. Shrink-only by construction; parity refuses.
  #
  # bi_secs — PROVISIONAL, shipped 2026-08-22 (b4b77868d) on CIFAR100 rows and
  # on no tinyimagenet row. The sentence that stood here ("same lane and phase
  # as cifar100; large-model truncation applies") was a transfer, not a
  # measurement of this category, and BOTH halves of the cifar argument have
  # now been checked against this model and only one of them survives.
  #
  # WHICH SIDE TINY IS ON — from the shipped ONNX, not from the file name. The
  # BI phase costs two `run_prefix` passes per 256-column chunk, at most
  # topk=1024 columns per trunk ReLU (so 4 chunks on every layer of all three
  # nets), and one pass costs ~cols x (conv MACs in the frozen prefix). The
  # resulting work proxy, sum over trunk ReLUs of chunks x prefix MACs:
  #     CIFAR100_resnet_medium   3072 in,  55 460 ReLU elems,  90.8M MACs -> 1.9 G
  #     CIFAR100_resnet_large    3072 in, 286 820 ReLU elems, 359.3M MACs -> 7.8 G
  #     TinyImageNet_resnet_med  9408 in, 172 296 ReLU elems, 278.2M MACs -> 5.9 G
  # The proxy predicts cifar large/medium = 4.05x; the MEASURED cifar ratio is
  # 24-35s vs 6.6-8.4s, i.e. ~3.9x, so the model is calibrated to ~3% on the one
  # ratio we have. Applied to tiny it gives 3.06 x 6.6-8.4s = 20-26 s.
  # => TinyImageNet is LARGE-LIKE, not medium-like: this phase is TRUNCATED at
  # the 20 s default, and only just — it sits ON the boundary. At ~78% of the
  # work done the casualties are trunk layer 8 and the 200-wide HEAD ReLU, i.e.
  # the last layer before the output Gemm.
  #
  # WHY THE cifar "FREE" ARGUMENT DOES NOT TRANSFER.
  # [SUPERSEDED — the "no tree to repay them with" premise below is measured
  #  FALSE on the current binary. Read the correction block ~40 lines down
  #  before using any number in this paragraph.]
  # On resnet_large the extra
  # seconds were repaid by a smaller tree (idx_5410 39->28 expansions, idx_496
  # 2->1). This lane has no tree to repay them with: the measured tinyimagenet
  # BaB is 0.5 s / 2 expansions (measured on the 128.8 s f64 lane above; the
  # same lane is 58.1 s with root_f32), and `root_f32` halves the forward
  # tableau only — the BI backward engine is f64 and gets no speedup — so BI
  # seconds come straight out of what is left for the tree, which at 58 s of
  # root plus 20-26 s of BI is only ~16-22 s of a 100 s budget. And this
  # category's banked unsats hug the wall: 60
  # of the 64 publish at 89.5-97.1 s of a 100 s budget, and the 2026-08-11
  # 200-row parity sweep (075a344ff) lost banked idx_9535 by ONE second on a
  # re-run. Up to +6 s of additive root cost is therefore a live regression
  # risk, not a no-op.
  #
  # WHY IT IS NOT SIMPLY REVERTED. `out_of_time()` stops the phase on wall
  # clock, so a category sitting exactly on the boundary gets a LOAD-DEPENDENT
  # root and a nondeterministic verdict — the same pathology 40 de-randomised
  # on cifar idx_5308. Reverting is also a change, and to the worse-conditioned
  # side of the boundary.
  # (CORRECTION 2026-08-24: "mid-chunk" was wrong. The clock is polled BETWEEN
  # passes and never inside one, which is why #bi-adaptive-chunk now sizes each
  # pass from a measured per-layer rate so the unavoidable one-pass overshoot is
  # bounded. The load-dependence argument survives and is in fact stronger: the
  # cut now lands on a 16-column boundary rather than a 256-column one.)
  #
  # ==> THE THREE PARAGRAPHS ABOVE ARE MEASURED-FALSE. READ THIS FIRST. <==
  # Every quantitative claim above about what this phase COSTS was read off
  # `[backward-interm] done: ... secs=`. That clock is `BiState::t0`, which
  # starts immediately before the forward tableau op walk, not at the phase.
  # It is op-walk wall, not full-build wall or phase compute. MEASURED
  # DIRECTLY 2026-08-24 on idx_5451_sidx_5891 at the official 100 s budget from
  # the phase's own per-layer lines:
  #     layer=1 cols=553/553 secs=1.05 total_secs=6.76
  #     layer=2 cols=387/387 secs=1.78 total_secs=14.05
  #     done: ... last_chunk=0.64s secs=48.88 exhausted=true
  #     tree_loop entry root_bound=-0.601745
  #     [trace] exp 117 worst -0.00929 depth 7 open 12 (40.1s); lane 93.2 s
  #   * The phase's OWN compute is 2.83 s of a 48.9 s walk interval (~3% of the
  #     lane), NOT the 20-26 s the conv-MAC proxy predicted and NOT 45%.
  #   * The predicted casualties ("trunk layer 8 and the 200-wide HEAD ReLU, at
  #     ~78% of the work done") are wrong by a mile: the phase gets TWO layers
  #     of ~10 before `exhausted=true`, because the FORWARD BUILD spends the
  #     shared 20 s clock. The phase is STARVED here, not truncated at 78%.
  #   * "This lane has no tree to repay them with: the measured tinyimagenet
  #     BaB is 0.5 s / 2 expansions" is DEAD. 117+ expansions over 40 s, the
  #     frontier draining 48 -> 32 -> 12, the worst margin closing
  #     -0.60174 -> -0.00929 and STILL improving when the lane runs out of
  #     wall. This lane is root-build-bound (48.9 s of 93.2 s) with a tree that
  #     is working, which is the opposite of the picture assumed here.
  # `work_secs=` on the done line now reports phase compute, so the pre-
  # registered A/B below must read THAT, not `secs=`.
  #
  # BI_SECS CURRENT DECISION. The 2026-08-24 pre-tableau-f32 dose response did
  # run: a higher, deadline-capped dose solved idx_5185 once, then validated
  # 0/3 (1/4 total), was row-dependent/non-monotone, and did not bank. idx_9611
  # failed in every dose on that dirty binary, so it is not evidence that the
  # higher dose caused the loss. Tiny therefore remains at the measured 20 s
  # default; it does not inherit CIFAR100's 40.
  #
  # The 2026-08-25 tableau-f32 shipment then cut the root build by ~17.9 s and
  # invalidated the old bank-wall and 0.5 s / 2-expansion premises. A new dose
  # decision needs a clean CURRENT-binary A/B, not another reading of those
  # stale walls. Exact reviewed arms are 20 vs 30: 40 is CIFAR's shipped point,
  # while 60 can never execute exactly under the 40%-of-remaining deadline cap.
  # Require the versioned backward-intermediate receipt on every row:
  # `deadline_capped=false`, `budget_exhausted=true`, and live completed chunks.
  # At minimum include the current marginal controls 1126/6700/9611/5451 plus
  # sat sentinels; do not add a YAML value without a retained moat-qualified win.
  backward_interm: true
  reserve_secs: 0
  concurrent: true
  root_f32: true
  # #tableau-f32 — f32 STORAGE for the root tableau walk, on TINY'S OWN
  # evidence (alloc-trio rule: NOT transferred to cifar100, which sets
  # root_f32 too but has no A/B of its own).
  #
  # WHAT IT DOES. `root_f32` made the forward conv COMPUTE in f32 but left
  # every tensor STORED f64, so each conv still allocated a multi-GB f32
  # scratch, ran a full read-f64/write-f32 cast pass over the whole tableau,
  # and wrote an f64 dst. This stores the M and D lanes as f32 end-to-end:
  # the scratch and the cast pass are DELETED and the dst write halves.
  #
  # MEASURED 2026-08-25, scored tier (mip,cuda, rev 4982, commit fd88088c),
  # official 100 s budgets, 3 rows x 4 arms + 3-run banks:
  #     forward conv   41.4 s -> 24.6 s   (-40.5%)
  #     root build     46.9 s -> 29.1 s   (-38.1%, ~17.9 s freed)
  #     idx_5451   banked timeout -> UNSAT 3/3 (84.7/86.7/85.3 s, certified)
  #     idx_9611   banked unsat preserved 3/3, and proves 17.7 s EARLIER
  #
  # THE MECHANISM IS NOT "MORE EXPANSIONS" — that framing is wrong. idx_9611
  # proves in BOTH arms at the SAME depth (127 vs 118 expansions), just
  # 17.7 s sooner: the tree does the same work and the whole gain is root
  # build. idx_5451 converted because the control arm was ~2 s SHORT of the
  # tree time it already needed. Rows that are ROOT-bound rather than
  # TREE-bound do not flip: idx_8472 got the BEST root bound of any arm
  # (-0.4749 vs control -0.5167) and still timed out with its worker
  # mid-expansion.
  #
  # SOUNDNESS. Pure loosening: conv-lane stores are bit-exact, radius-role
  # stores are directed UP, and every remaining store perturbation is charged
  # into the certified `g_err` concretize slack (additive on BOTH endpoints).
  # It can lose a proof; it cannot manufacture one. Oracles:
  # tableau_f32_store_per_site_containment_oracle (31,845 exact checks),
  # _dj_encloses_true_margin, _boxes_contain_f64_and_off_arm_is_bitwise,
  # conv_f32_native_store_is_bitwise_the_widened_path.
  #
  # SHIP GATE (docs/TABLEAU_F32_2026-08-20.md:149-168), the one that can
  # actually falsify a LOOSENING lever: the 11 at-risk banked unsats that
  # publish at 90.5-97.1 s of 100 s, x3, plus sat sentinels 6827/9558/6252.
  # All held 3/3. A moat of comfortable rows would NOT have tested this —
  # see the commit message.
  tableau_f32: true
  # FIELDS DELIBERATELY ABSENT (the alloc-trio rule, stated as a diff against
  # cifar100_2024.yaml — the only other preset with a `margin_row:` section).
  # Pinned executably by `margin_row_wall_preset_field_diff_is_deliberate`.
  #
  # * k_head / k_trunk: 16 — NOT transferred. cifar's evidence is a frontier
  #   EXPLOSION on resnet_medium (idx_8600: open 18->41->156->415 at k=8, proves
  #   at k=16 with the frontier draining 424->2). This lane never gets near that
  #   regime: the measured tinyimagenet BaB is 0.5 s / 2 expansions, and after
  #   the root build plus the ~20-26 s BI phase the tree has ~16-22 s of the
  #   100 s budget left — a handful of expansions, each ~3x cifar's cost if
  #   per-expansion work tracks conv MACs as the BI phase does. Fixed k=16
  #   doubles candidate scoring on every one of them and buys a width a 2-deep
  #   frontier cannot use.
  #   `margin_row.k_adaptive` is the better-shaped candidate here — a one-way
  #   ratchet that fires at open>=32 and is BIT-IDENTICAL below it, so on a
  #   frontier this shallow it is a provable no-op with upside only — but it is
  #   env-only and unmeasured on this category. Measure before arming.
  #
  #   !! EVERY NUMBER IN THE PARAGRAPH ABOVE IS FALSE ON THE CURRENT BINARY. !!
  #   Re-measured 2026-08-24, idx_5451_sidx_5891, official 100 s, pinned binary,
  #   box lock held, instance line verified. From the run's own [trace] lines:
  #       exp   0 worst -0.60174 depth 0 open  1  (0.0s)
  #       exp  37 worst -0.13608 depth 6 open 32  (13.7s)
  #       exp  57 worst -0.09242 depth 7 open 44  (20.4s)
  #       exp  77 worst -0.05253 depth 8 open 48  (27.7s)
  #       exp  97 worst -0.02365 depth 8 open 32  (34.3s)
  #       exp 117 worst -0.00929 depth 7 open 12  (40.1s)
  #     - "0.5 s / 2 expansions"  -> 117+ expansions over ~40 s.
  #     - "a handful of expansions" -> 117+, at ~0.34 s each, not ~3x cifar's.
  #     - "a 2-deep frontier"     -> depth 8, open PEAKING AT 48.
  #     - "the tree has ~16-22 s" -> it has ~40 s (root build 48.9 s of 93.2 s;
  #       the BI phase is 2.83 s, not 20-26 s — see the correction above).
  #   AND THE CONCLUSION ABOUT k_adaptive INVERTS. It is dismissed here as "a
  #   provable no-op with upside only" because it fires at open>=32 and this
  #   frontier was believed to be 2 wide. The frontier reaches open=48 and sits
  #   at or above 32 from exp 37 to exp 97 — roughly HALF the tree's wall — so
  #   the ratchet is live on this category, not inert. That makes k_adaptive a
  #   real unmeasured candidate rather than a safe no-op, and it must be
  #   measured before it is armed, for the opposite reason to the one given.
  #   NOT ACTED ON HERE: this file's k_head/k_trunk absence stands untouched
  #   until someone A/Bs it. The rationale is what was wrong, and a rationale
  #   that is false on the current binary is exactly the shape that was worth
  #   +12.9 normalized points on collins when it was finally re-measured.
  #
  #   ANSWERED 2026-09-16 — that A/B has now been run, and k_trunk IS armed
  #   above (`k_trunk: 1`). 5 paired rows (+49% expansions), 25 candidate rows
  #   (1 control-verified conversion), 18 banked unsats clean. See the note on
  #   the key itself. k_head remains untouched and unmeasured.
  #
  #   ⚠ AND ONE FIGURE IN THE BLOCK ABOVE IS STALE: "root build 48.9 s of
  #   93.2 s" is not what the current binary does. The first tinyimagenet
  #   margin-row phase profile (2026-09-15) measures root_gate_build at
  #   22.3 s and 23.1 s on two rows — 2.7% and 4.1% of tracked lane time.
  #   The root is NOT half this category's wall; score_candidates is ~50%.
  #
  # * adaptive_reserve: true — NOT transferred, and it is NOT interchangeable
  #   with the `reserve_secs: 0` above even though both hand the internal
  #   verifier the whole budget. `margin_row_reserve_decision` short-circuits on
  #   `configured_secs == 0` to route `NotApplicable`, and
  #   `enables_scored_sparse_crown()` is true ONLY for
  #   `AdaptiveReleasedAlphaBetaTier`. So the single observable difference is
  #   that cifar additionally arms the scored sparse root CROWN pass inside the
  #   internal verifier. On this category that verifier reports
  #   `domains_explored: 0` and has never produced a verdict (see
  #   `complete_clip_experiment_is_scoped_to_cifar100_not_tinyimagenet`), so the
  #   pass would spend host time competing with the lane that does. Also already
  #   pinned absent by `tinyimagenet_2024_rejects_the_regressive_cifar100_allocation_trio`.
  #
  # * verifier_threads — unset, i.e. no cap, and now MEASURED NEGATIVE: keep it
  #   unset. This was "the most promising unmeasured scheduling lever for this
  #   category", to ship only after an A/B. THE A/B HAS BEEN RUN and it says no.
  #
  #   The premise is half right. The concurrent lane really is the only prover
  #   here: across this campaign's own logs, 142 of 142 cifar100 and 4 of 4
  #   tinyimagenet `unsat` runs came from the lane and ZERO from the internal
  #   alpha/beta verifier. What does NOT follow is that the lane is starved by it.
  #
  #   MEASURED 2026-09-17, pinned 074a3f25f68bd51f, official 100 s, zero NY_*,
  #   row idx_4330_sidx_3504, 3 arms x 3 reps, arm order ROTATED per rep, strict
  #   quiescence, load_before recorded per run (2.36-2.90, no ordering bias):
  #
  #       arm  lane pool    lane times (s)      mean    vs ctl   exp
  #       ctl  20 shared    34.9, 35.0, 34.7    34.87    ---      22
  #       2    18 private   34.9, 35.5, 35.6    35.33   +1.3%     22
  #       4    16 private   37.6, 37.9, 37.2    37.57   +7.7%     22
  #
  #   `exp=22` on all nine runs — identical trees, so this is a pure timing
  #   endpoint with sd 0.12 s on the control. Engagement 9/9
  #   (global_pool_route=applied, lane_pool_threads = 20-N, concurrent_spawned=
  #   true); the field doc warns an already-initialized pool VOIDS the A/B, and
  #   that never occurred.
  #
  #   => lane time is monotone in LANE width, not in verifier contention. 18
  #   threads is indistinguishable from the shared 20; 16 costs 7.7%. There is no
  #   starvation to relieve, because partitioning 20 into N + (20-N) only takes
  #   threads off the lane. The `vnncomp.rs` note that "the wall presets run the
  #   verifier on device: wgpu, so the two lanes are on different hardware and
  #   barely contend" is the one that holds: vt2 matching the shared pool bounds
  #   the verifier's host-CPU appetite at under two threads' worth. The
  #   margin_row_bab.rs note that the lane "runs ~2.4x slower concurrently than
  #   standalone" is not refuted but SCOPED — it is not true of these wgpu wall
  #   presets, whatever configuration it measured.
  #
  #   Worth keeping from it: -20% lane threads costs only 7.7% wall, so the lane
  #   is far from linearly parallel and a future lever can take ~2 host threads
  #   back for free.
  #
  # * concurrent_threads — unset on both presets. Without a positive verifier
  #   request this preserves the shared global pool; with one it derives only
  #   from observed host parallelism minus actual global width. Explicit `0`
  #   would instead force the shared global pool. Neither width has a closed
  #   allocation A/B, so no shipped preset chooses it.
  #
  # * early_exit — unset, which means ON (`early_exit_armed` defaults true). No
  #   key needed; the kill switch is `margin_row.early_exit: false`.
  #
  # * reserve_max_frac / release_frac — unset by design: with `reserve_secs: 0`
  #   the reserve arithmetic is never reached, so a value here would be inert.

  # #tiny-alpha-aligned ARMED 2026-09-22 — the root ascent, which this category
  # has never shipped, with the gradient fixed and its cost cap unpinned.
  #
  # WHY IT WAS OFF: the 2026-08-30 attempt bought bound with SEARCH TIME and lost
  # 3 of 6 rows. Two causes, both now fixed: (1) the direction was a MEAN over 8
  # columns for an objective that is a MIN — `alpha_cols: 1` aligns them; (2)
  # `alpha_secs` was unset, resolving to the global default 20.0, a CAP the
  # ascent saturates rather than a spend it chooses.
  #
  # MEASURED, pin ny_specalpha_0301, official 100 s, order rotated, 0 VOID in 36
  # runs. Screen of the 8 NEAREST timeout rows (frontier census): the published
  # root improves on 8/8 (+0.008..+0.157), and the two conversions are ranks 1
  # and 2 by root gain. Replication, 5 reps/arm:
  #   idx_2045_sidx_7367   ctl 1/5 (95.8 s)   arm 5/5 (median 86.7 s)   p=0.024
  #   idx_5683_sidx_1212   ctl 0/5            arm 2/5                   p=0.222
  #   POOLED               ctl 1/10           arm 7/10                  p=0.0099
  # Root BIT-IDENTICAL every rep; the verdict nondeterminism is search/wall.
  #
  # ⚠ Neither row is a deterministic banked conversion: idx_2045's control
  # proves it 1/5 (the lever buys RELIABILITY + ~9 s of headroom there), and
  # idx_5683 is 2/5. Armed because it converts marginal rows 7x more often, and
  # 61 banked unsats here publish within 10 s of the wall (34.9 pts at risk).
  alpha_opt: true
  alpha_cols: 1
  alpha_secs: 35.0
bab:
  batch_size: 128
  auto_enlarge_batch_size: true
  branching:
    # method removed: model-class-aware auto-branching selects ReLU-split (kFSB,
    # graph engine) for this high-dim conv net (9408-element input) — input-splitting
    # is hopeless. candidates/reduceop still tune kFSB. See branching.rs.
    candidates: 10
    # Exact wave-selector mirrors for governed search; runtime is unchanged.
    kfsb_multi_candidates: 10
    kfsb_multi_reduceop: max
  alpha_crown:
    lr_alpha: 0.2
    iterations: 20
  # Phase budget overrides (#2206 Packet E).
  # Cap warmup at 15% to prevent alpha-CROWN from consuming the entire budget
  # on large ResNet models. Reserve 10% for post-BaB PGD fallback.
  phase_budget:
    # #attack-extend gate cannot discriminate on this benchmark: near-boundary
    # (promising-margin) HOLD instances trigger the extension, which then consumes
    # the entire remaining budget before warmup/BaB ever run (measured 2026-07-12:
    # prop8945 with the extension = 6-line silent timeout; with 0.0 = 890 BaB
    # domains and best margin +0.018 at the 100s budget). Same class of fix as
    # disjunctive_pgd_max_secs below.
    attack_extension_fraction: 0.0
    initial_bounds_fraction: 0.15
    # The graph gradient disjunctive PGD (graph_pgd.rs `try_graph_disjunctive_pgd_attack`)
    # replaced the old RANDOM-SAMPLING disjunctive attack, which found nothing on these
    # conv ResNets and was therefore cut to 0.10. Gradient PGD is productive — it finds
    # the `sat` counterexamples (oracle-confirmed) in seconds, as α,β-CROWN does — so the
    # budget is restored to 0.40. The CIFAR allocation trio (root cap 40s, PGD 0.05,
    # adaptive margin reserve) was tested here and regressed the official-budget sample
    # from 5/10 to 2/10, losing three SAT rows. Keep TinyImageNet's measured baseline;
    # see docs/TINYIMAGENET_ALLOCATION_PARITY_2026-07-30.md.
    #
    # The 30s absolute ceiling still reclaims excess attack time at longer budgets while
    # leaving the full 0.40 slice available on the official 100s rows.
    disjunctive_pgd_fraction: 0.40
    disjunctive_pgd_max_secs: 30
    # #graph-mip-admission-refund, mirrored from cifar100_2024.yaml (which
    # measured the A/B on the sibling ResNet). All 200 tinyimagenet rows load
    # ONE model, TinyImageNet_resnet_medium.onnx, whose op multiset is IDENTICAL
    # to the already-refunded CIFAR100_resnet_medium — {Conv:19,
    # BatchNormalization:19, Relu:10, Add:8, Flatten:1, Gemm:2} (verified by
    # onnx op-type census on both files) — at 3x the spatial extent (3x56x56 =
    # 9408 input elements vs 3x32x32 = 3072; 3.06x, NOT the 4x a 64x64 reading
    # of "tiny-imagenet" suggests).
    #
    # Every op in that set is INSIDE the Graph-MIP encoder's layer set
    # (dispatch.rs `graph_mip_layer_set_supported`: Linear|Conv2d|Flatten|
    # Reshape|BatchNorm|Add|ReLU), so the static #deadlane disarm
    # (`with_static_mip_ineligibility`) does NOT fire here the way it does on
    # vit_2023/yolo_2023 — the reservation stays ARMED and the slice is carved
    # out of the scored budget on every row. What declines instead is the
    # MEMORY cap: replaying `graph_mip_leaf::estimate_encode_nnz`'s shape
    # formula over the ONNX graphs gives ~281M nnz for TinyImageNet_resnet_medium
    # vs ~91M for CIFAR100_resnet_medium (the same 3.07x), i.e. ~56x the shipped
    # 5M `NY_GRAPH_MIP_MAX_NNZ` admission cap that already rejects cifar100. The
    # nnz gate is the binding one (cifar100's ~494 binaries already cleared the
    # 1024-binary ladder). The estimate is NOT purely shape-derived — it also
    # counts UNSTABLE ReLUs, which is bounds-dependent — but that term is
    # strictly ADDITIVE, and the shape-only floor alone is ~281M. So no bound,
    # budget, or verdict can bring the encode under 5M. The whole-net escalation
    # is therefore unreachable on 200/200 rows.
    #
    # Cost of leaving it armed (arithmetic from verify/phase_budget.rs
    # `bab_deadline`/`mip_reserved_slice`, default policy 0.25/[5,30]):
    #   - shipped 100s row -> 95s internal tier (`internal_timeout_secs`):
    #     BaB ends at 95*0.9 - clamp(23,5,30) = 62.5s instead of 85.5s, and the
    #     ~32s grant DOES clear the 20s `NY_GRAPH_MIP_MIN_SLICE_S` gate, so it
    #     additionally pays up to an 8s post-BaB bounds recompute before the nnz
    #     line prints "NOT eligible".
    #   - 50s tier: BaB ends at 50*0.9 - 12 = 33s and the 17s grant is below the
    #     20s min-slice gate, so the reserved time is pure dead wall.
    # Zeroing both keys makes `requests_mip_reservation()` false, which (a)
    # returns the slice to BaB inside the same scored budget, (b) declines the
    # whole-net AUTO escalation up front (graph_mip_escalate.rs
    # `graph_mip_policy_admitted`), and (c) suppresses the root-bounds stash
    # clone (graph_mip_leaf.rs `graph_mip_stash_enabled`). Explicit
    # `--complete-verifier mip` remains an override and the independent per-leaf
    # MIP oracle is untouched. Sound by construction: this only moves the BaB
    # deadline LATER inside the unchanged `overall_deadline`, and removes a code
    # path that could only ever return "not eligible" — no bound is loosened and
    # no verdict can change.
    mip_min_fraction: 0.0
    mip_min_secs: 0
    post_bab_pgd_fraction: 0.10
