# VGG16 ImageNet robustness: 18 instances, 1200 seconds each.
# Historical results: reports/measured-2026/vggnet16_2022.csv.
# Input-split/MaxPool-rewrite experiment: vggnet16_2022_abcrown_parity_canary.yaml.

general:
  root_path: ../../benchmarks/vnncomp2025/benchmarks/vggnet16_2022
  csv_name: instances.csv
  device: wgpu

bab:
  batch_size: 1
  # Keep time for branch-and-bound and the final PGD stage.
  phase_budget:
    initial_bounds_fraction: 0.15
    disjunctive_pgd_fraction: 0.10
    post_bab_pgd_fraction: 0.10
