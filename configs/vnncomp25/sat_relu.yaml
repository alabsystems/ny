#
# sat_relu VNN-COMP 2025 benchmark config
#
# Benchmark characteristics:
# - NeuroCodeBench 2.0: SAT/UNSAT ReLU instances
# - Small feedforward networks (30-65 variables, 38-187 clauses)
# - 100 instances, mix of SAT (violated) and UNSAT (verified)
# - #3277 (ORT shape merge) FIXED — models now load correctly
# - #3283 (MIP false counterexamples) FIXED 2026-03-04
# - STATUS: Routed through HiGHS MIP via run_instance.sh (#3454).
#   BaB with CROWN relaxation is fundamentally too loose for SAT-encoded networks
#   (0/100 instances with 100K domains). Reference uses MIP exclusively.
# - alpha-beta-CROWN reference: uses Gurobi MIP with 1000 PGD restarts, pgd_alpha=10
# - ny uses HiGHS MIP (#1763). BaB config below is fallback only.

general:
  # Route the whole budget to the HiGHS MIP complete verifier (winner parity:
  # alpha-beta-CROWN uses complete_verifier: mip for this category). CROWN/BaB
  # relaxation is fundamentally too loose for SAT-encoded nets (0/100 at 100K
  # domains) and the auto post-BaB escalation never fired in-budget: the
  # category scored ~0. With MIP routing + exact-semantics witness
  # revalidation: every-7th sample = 4 sat + 3 unsat of 15 (2026-07-03).
  complete_verifier: mip
  root_path: ../../benchmarks/vnncomp2025/benchmarks/sat_relu
  csv_name: instances.csv

# Note: double_fp requires --double-fp CLI flag; solver.propagation is not
# parsed by the PresetConfig loader (only VerifyConfigFile supports it).

solver:
  mip:
    # ay backend (SOLVER POLICY: all solving on ay). CDCL(T) conflict analysis prunes the
    # SAT-encoded large-UNSAT instances that HiGHS serial B&B enumerates
    # node-by-node (6 unsat timeouts + a cliff at 80-110s with HiGHS).
    # Requires a build with --features mip and an ay binary ($NY_AY/$PATH).
    mip_solver: ay

attack:
  pgd_order: middle
  pgd_restarts: 1000

bab:
  batch_size: 64
  branching:
    method: input
    candidates: 5
    reduceop: max
  clip:
    relaxed: true
    relaxed_iterations: 20
  alpha_crown:
    lr_alpha: 0.2
    iterations: 100
  beta_crown:
    lr_alpha: 0.1
    lr_beta: 0.15
    iterations: 25
